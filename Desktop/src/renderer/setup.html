<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'">
  <title>RPG Table — Server</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <h1>Connect to your table</h1>
  <p class="sub">Point the app at the RPG Table server you play on.</p>

  <section>
    <h2>Server address</h2>
    <label for="url">Address or full URL</label>
    <div class="row">
      <input class="grow" type="text" id="url" spellcheck="false"
             placeholder="rpg.example.com  ·  192.168.1.20:3000  ·  https://…">
      <button id="test">Test</button>
    </div>
    <p class="hint">
      A bare host is tried over HTTPS first, then HTTP. A self-hosted certificate
      will ask for your approval once, then be remembered.
    </p>
    <div class="msg" id="msg"></div>
    <div id="mismatch"></div>
  </section>

  <div class="footer">
    <button id="cancel">Cancel</button>
    <button class="primary" id="connect" disabled>Connect</button>
  </div>

  <script src="setup.js"></script>
</body>
</html>
