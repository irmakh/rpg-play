<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stories</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
<link rel="stylesheet" href="/css/dm.css">
<link rel="stylesheet" href="/css/stories.css">
</head>
<body>

<!-- Stories password gate -->
<div class="gate" id="stories-gate" style="display:none">
  <div class="gate-box">
    <div style="font-size:36px;margin-bottom:10px">📖</div>
    <h2>Stories</h2>
    <p>Enter your password to continue.</p>
    <input type="password" id="gate-pw" placeholder="Password…" autocomplete="off"
           onkeydown="if(event.key==='Enter')storiesGateSubmit()">
    <div id="gate-err" style="color:var(--err);font-size:12px;min-height:16px;margin-top:6px"></div>
    <button class="btn primary" style="width:100%;margin-top:8px" onclick="storiesGateSubmit()">Enter</button>
  </div>
</div>
<script>
(function(){
  try {
    var s = JSON.parse(sessionStorage.getItem('rpgSession') || 'null');
    if (s && (s.role === 'dm' || s.role === 'character')) return;
  } catch {}
  if (sessionStorage.getItem('storiesAuth') === '1') return;
  document.getElementById('stories-gate').style.display = 'flex';
  setTimeout(function(){ var el = document.getElementById('gate-pw'); if(el) el.focus(); }, 50);
})();
async function storiesGateSubmit() {
  var pw = document.getElementById('gate-pw').value;
  var errEl = document.getElementById('gate-err');
  errEl.textContent = '';
  if (!pw) { errEl.textContent = 'Enter a password.'; return; }
  var r = await fetch('/api/auth/verify-any', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  if (r.ok) {
    sessionStorage.setItem('storiesAuth', '1');
    document.getElementById('stories-gate').style.display = 'none';
  } else {
    errEl.textContent = 'Wrong password.';
    document.getElementById('gate-pw').value = '';
    document.getElementById('gate-pw').focus();
  }
}
</script>

<div class="stories-wrap">

  <div class="stories-hdr">
    <a href="/dm.html" class="btn" style="padding:4px 10px;font-size:11px">← Back</a>
    <h1>Stories</h1>
    <div class="hdr-right">
      <span id="status-msg" class="status-msg"></span>
      <select id="char-filter" class="stories-filter" onchange="renderGrid()">
        <option value="">All characters</option>
      </select>
      <button class="btn primary" onclick="openNewModal()">+ New Story</button>
    </div>
  </div>

  <div class="stories-main">
    <div id="story-grid" class="story-grid">
      <div class="empty-hint">Loading…</div>
    </div>
  </div>

</div>

<!-- New story modal -->
<div class="modal-overlay" id="new-modal" style="display:none" onclick="if(event.target===this)closeNewModal()">
  <div class="modal-box" style="max-width:420px;width:96%">
    <div class="ct">New Story</div>
    <div class="modal-body">
      <div class="field">
        <label class="lbl">Title</label>
        <input type="text" id="new-title" maxlength="120" placeholder="e.g. The Battle of Neverwinter"
               onkeydown="if(event.key==='Enter')createStory()">
      </div>
      <div class="field">
        <label class="lbl">Description <span style="font-weight:normal;color:var(--txd)">(optional)</span></label>
        <textarea id="new-desc" rows="2" placeholder="A short summary of this story…"></textarea>
      </div>
      <div id="new-err" style="color:var(--err);font-size:11px;min-height:14px"></div>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeNewModal()">Cancel</button>
      <button class="btn primary" onclick="createStory()">Create & Edit</button>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-overlay" id="del-modal" style="display:none" onclick="if(event.target===this)closeDelModal()">
  <div class="modal-box" style="max-width:360px;width:96%">
    <div class="ct">Delete Story</div>
    <div class="modal-body">
      <p id="del-msg" style="font-size:13px;line-height:1.5;color:var(--tx)"></p>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeDelModal()">Cancel</button>
      <button class="btn danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
let stories  = [];
let deleteId = null;

async function init() {
  await load();
}

async function load() {
  showStatus('Loading…');
  const r = await fetch('/api/stories');
  stories  = r.ok ? await r.json() : [];
  buildCharFilter();
  renderGrid();
  showStatus('');
}

// ── Character filter ──────────────────────────────────────────────────────────
function buildCharFilter() {
  const chars = [...new Set(stories.map(s => s.character).filter(Boolean))].sort();
  const sel   = document.getElementById('char-filter');
  const cur   = sel.value;
  sel.innerHTML = '<option value="">All characters</option>' +
    chars.map(c => `<option value="${esc(c)}"${cur === c ? ' selected' : ''}>${esc(c)}</option>`).join('');
}

// ── Grid ──────────────────────────────────────────────────────────────────────
function renderGrid() {
  const grid   = document.getElementById('story-grid');
  const filter = document.getElementById('char-filter').value;
  const list   = filter ? stories.filter(s => s.character === filter) : stories;

  if (!list.length) {
    grid.innerHTML = `<div class="empty-hint">${
      filter ? 'No stories for this character.' : 'No stories yet — create your first one!'
    }</div>`;
    return;
  }

  grid.innerHTML = list.map(s => {
    const cover = s.cover_image
      ? `<img class="story-cover" src="${esc(s.cover_image)}?v=${Date.now()}" alt="" loading="lazy">`
      : `<div class="story-cover-empty">📖</div>`;
    const panels = s.seq_count === 1 ? '1 panel' : `${s.seq_count || 0} panels`;
    const date   = (s.updated_at || s.created_at || '').slice(0, 10);
    return `<div class="story-card">
      <div class="story-cover-wrap">${cover}</div>
      <div class="story-card-body">
        <div class="story-card-title">${esc(s.story_name || 'Untitled')}</div>
        ${s.character ? `<div class="story-card-char">${esc(s.character)}</div>` : ''}
        <div class="story-card-meta">${panels} · ${date}</div>
        ${s.description ? `<div class="story-card-desc">${esc(s.description)}</div>` : ''}
      </div>
      <div class="story-card-foot">
        <a href="/story-viewer.html?id=${esc(s.id)}" class="btn sm primary">View</a>
        <a href="/story-builder.html?id=${esc(s.id)}" class="btn sm">Edit</a>
        <button class="btn sm danger" onclick="deleteStory('${esc(s.id)}','${esc(s.story_name || 'this story')}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

// ── New story ─────────────────────────────────────────────────────────────────
function openNewModal() {
  document.getElementById('new-title').value = '';
  document.getElementById('new-desc').value  = '';
  document.getElementById('new-err').textContent = '';
  document.getElementById('new-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('new-title').focus(), 50);
}
function closeNewModal() { document.getElementById('new-modal').style.display = 'none'; }

async function createStory() {
  const title = document.getElementById('new-title').value.trim();
  if (!title) { document.getElementById('new-err').textContent = 'Title is required.'; return; }
  const r = await fetch('/api/stories', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title,
      description: document.getElementById('new-desc').value.trim()
    })
  });
  const d = await r.json();
  if (!r.ok) { document.getElementById('new-err').textContent = d.error || 'Failed.'; return; }
  closeNewModal();
  location.href = '/story-builder.html?id=' + d.id;
}

// ── Delete story ──────────────────────────────────────────────────────────────
function deleteStory(id, name) {
  deleteId = id;
  document.getElementById('del-msg').textContent =
    `Delete "${name}" and all its panels and images? This cannot be undone.`;
  document.getElementById('del-modal').style.display = 'flex';
}
function closeDelModal() { document.getElementById('del-modal').style.display = 'none'; deleteId = null; }

async function confirmDelete() {
  if (!deleteId) return;
  await fetch('/api/stories/' + deleteId, { method: 'DELETE' });
  closeDelModal();
  await load();
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function showStatus(msg) { document.getElementById('status-msg').textContent = msg; }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeNewModal(); closeDelModal(); } });

init();
</script>
</body>
</html>
