<!DOCTYPE html>
<html lang="en" class="lamplit">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG Console</title>
<link rel="manifest" href="/console/manifest.json">
<meta name="theme-color" content="#080C15">
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{font-family:var(--ui);background:var(--ink);color:var(--bone);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

/* ── Login view ──────────────────────────────────────────────────────────── */
.login-wrap{width:100%;max-width:360px}
.login-box{background:var(--slate);border:1px solid var(--rule-hi);border-radius:10px;padding:28px 24px}
.login-logo{text-align:center;margin-bottom:20px}
.login-logo h1{color:var(--bone);font-size:22px;font-weight:bold}
.login-logo p{color:var(--ash);font-size:11px;margin-top:4px;}
.tab-row{display:flex;margin-bottom:20px;border-radius:5px;overflow:hidden;border:1px solid var(--rule-hi)}
.tab-btn{flex:1;padding:8px;background:transparent;border:none;color:var(--ash);font-size:12px;font-weight:bold;cursor:pointer;transition:background .15s}
.tab-btn.active{background:var(--arc);color:var(--ink)}
.tab-btn:not(.active):hover{background:var(--arc-fill);color:var(--bone)}
.tab-pane{display:none}.tab-pane.active{display:block}
.field{margin-bottom:13px}
.field label{display:block;font-size:10px;color:var(--bone);margin-bottom:4px}
.field input,.field select{width:100%;background:var(--slate-hi);border:1px solid var(--rule-hi);color:var(--bone);border-radius:4px;padding:8px 10px;font-size:13px;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--arc);background:var(--slate-hi)}
.field select option{background:var(--slate-hi)}
.login-btn{width:100%;padding:10px;background:var(--bone);border:none;color:var(--ink);border-radius:4px;font-size:13px;font-weight:bold;cursor:pointer;margin-top:2px}
.login-btn:hover{background:var(--arc-hi)}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-btn.ghost{background:transparent;border:1px solid var(--rule-hi);color:var(--ash);margin-top:7px}
.login-btn.ghost:hover{background:var(--arc-fill);color:var(--bone)}
.err-msg{color:var(--blood);font-size:11px;min-height:14px;margin-bottom:8px;text-align:center}
.step-title{font-size:13px;color:var(--bone);font-weight:bold;margin-bottom:3px}
.step-sub{font-size:11px;color:var(--ash);margin-bottom:14px}

/* ── Launcher view ───────────────────────────────────────────────────────── */
.launcher{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:0}
.launcher-logo{text-align:center;margin-bottom:6px}
.launcher-logo h1{color:var(--bone);font-size:26px;font-weight:bold}
.session-badge{font-size:11px;color:var(--ash);margin-bottom:24px;text-align:center}
.session-badge strong{color:var(--bone)}
.launch-btns{display:flex;flex-direction:column;gap:14px;width:100%}
.btn-launch{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:22px 20px;background:var(--slate);border:2px solid var(--rule-hi);border-radius:10px;color:var(--bone);text-decoration:none;font-size:17px;font-weight:bold;transition:background .15s,border-color .15s;text-align:center}
.btn-launch:hover,.btn-launch:active{background:var(--slate-hi);border-color:var(--arc)}
.btn-launch small{font-size:11px;color:var(--ash);font-weight:normal}
.logout-row{margin-top:20px;text-align:center}
.logout-btn{background:none;border:none;color:var(--ash);font-size:12px;cursor:pointer;text-decoration:underline;padding:4px}
.logout-btn:hover{color:var(--bone)}

/* Navigation is not an active state: base.css colours <a> with the accent,
   which would spend it on every launch card at once. */
html.lamplit .btn-launch,html.lamplit .btn-launch:hover{color:var(--bone);text-decoration:none}
html.lamplit .btn-launch:hover{background:var(--slate-hi)}
</style>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/base.css">
<script src="/js/lib/icons.js"></script>
<script src="/js/lib/auth-ui.js"></script>
</head>
<body>

<!-- ── Login view ─────────────────────────────────────────────────────────── -->
<div id="view-login" class="login-wrap" style="display:none">
  <div class="login-box">
    <div class="login-logo">
      <h1><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-target"></use></svg> RPG Console</h1>
      <p>Dual-Screen Mode</p>
    </div>

    <div class="tab-row">
      <button class="tab-btn active" id="tb-char" onclick="cSwitch('character')">Character</button>
      <button class="tab-btn" id="tb-dm" onclick="cSwitch('dm')">Dungeon Master</button>
    </div>

    <!-- Character tab -->
    <div class="tab-pane active" id="pane-character">

      <!-- Step 1: select + password -->
      <div id="char-step-login">
        <div class="field">
          <label>Character</label>
          <select id="char-select">
            <option value="">Loading…</option>
          </select>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="char-pw" placeholder="Enter password…" autocomplete="current-password"
                 onkeydown="if(event.key==='Enter')cLoginChar()">
        </div>
        <div id="char-cap"></div>
        <div class="err-msg" id="char-err"></div>
        <button class="login-btn" id="char-login-btn" onclick="cLoginChar()">Login</button>
      </div>

      <!-- Step 2: first-time password setup -->
      <div id="char-step-setup" style="display:none">
        <div class="step-title" id="setup-char-name"></div>
        <div class="step-sub">No password set yet — choose one to continue.</div>
        <div class="field">
          <label>New Password</label>
          <input type="password" id="setup-pw1" placeholder="Choose a password…" autocomplete="new-password"
                 onkeydown="if(event.key==='Enter')document.getElementById('setup-pw2').focus()">
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input type="password" id="setup-pw2" placeholder="Confirm password…" autocomplete="new-password"
                 onkeydown="if(event.key==='Enter')cSetupPassword()">
        </div>
        <div class="err-msg" id="setup-err"></div>
        <button class="login-btn" id="setup-btn" onclick="cSetupPassword()">Set Password &amp; Login</button>
        <button class="login-btn ghost" onclick="cCancelSetup()">Back</button>
      </div>

    </div><!-- /pane-character -->

    <!-- DM tab -->
    <div class="tab-pane" id="pane-dm">
      <div class="field">
        <label>Master Password</label>
        <input type="password" id="dm-pw" placeholder="Enter master password…" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')cLoginDM()">
      </div>
      <div id="dm-cap"></div>
      <div class="err-msg" id="dm-err"></div>
      <button class="login-btn" onclick="cLoginDM()">Login as DM</button>
    </div>

  </div>
</div>

<!-- ── Launcher view ──────────────────────────────────────────────────────── -->
<div id="view-launcher" class="launcher" style="display:none">
  <div class="launcher-logo"><h1><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-target"></use></svg> RPG Console</h1></div>
  <div class="session-badge" id="session-badge"></div>
  <div class="launch-btns" id="launch-btns"></div>
  <div class="logout-row">
    <button class="logout-btn" onclick="cLogout()">Logout</button>
  </div>
</div>

<script>
// ── Session helpers ───────────────────────────────────────────────────────────
function _storeSession(sess) {
  sessionStorage.setItem('rpgSession', JSON.stringify(sess));
  if (sess.role === 'dm') {
    sessionStorage.setItem('tableMasterPw', sess.masterPw);
    sessionStorage.setItem('dmMasterPw', sess.masterPw);
  } else {
    sessionStorage.removeItem('tableMasterPw');
    sessionStorage.removeItem('dmMasterPw');
  }
}

function _getSession() {
  try { return JSON.parse(sessionStorage.getItem('rpgSession') || 'null'); } catch { return null; }
}

// ── Maths captchas (js/lib/auth-ui.js) ───────────────────────────────────────
// A login returns a SESSION TOKEN, stored where the password used to be
// (masterPw / charPw) so every request header on the console pages carries it.
let _capChar = null, _capDm = null, _setupTicket = null;
function cMountCaptchas() {
  if (!_capChar) _capChar = AuthUI.captcha(document.getElementById('char-cap'), { onEnter: cLoginChar });
  if (!_capDm)   _capDm   = AuthUI.captcha(document.getElementById('dm-cap'), { onEnter: cLoginDM, lazy: true });
}

// ── Tab switcher ──────────────────────────────────────────────────────────────
function cSwitch(tab) {
  if (tab === 'dm') _capDm?.ensure();
  document.getElementById('tb-char').classList.toggle('active', tab === 'character');
  document.getElementById('tb-dm').classList.toggle('active', tab === 'dm');
  document.getElementById('pane-character').classList.toggle('active', tab === 'character');
  document.getElementById('pane-dm').classList.toggle('active', tab === 'dm');
  setTimeout(() => {
    (tab === 'dm'
      ? document.getElementById('dm-pw')
      : document.getElementById('char-pw')
    )?.focus();
  }, 30);
}

// ── Character login ───────────────────────────────────────────────────────────
async function cLoadChars() {
  try {
    const res = await fetch('/api/characters');
    if (!res.ok) throw new Error();
    const chars = await res.json();
    const sel = document.getElementById('char-select');
    const pcs = chars.filter(c => c.char_type === 'pc');
    if (pcs.length === 0) {
      sel.innerHTML = '<option value="">No characters found</option>';
      return;
    }
    sel.innerHTML = pcs.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  } catch {
    document.getElementById('char-select').innerHTML = '<option value="">Error loading characters</option>';
  }
}

async function cLoginChar() {
  const characterId = document.getElementById('char-select').value;
  const password    = document.getElementById('char-pw').value;
  const errEl       = document.getElementById('char-err');
  errEl.textContent = '';
  if (!characterId) { errEl.textContent = 'Select a character.'; return; }
  if (!password)    { errEl.textContent = 'Enter your password.'; return; }
  const btn = document.getElementById('char-login-btn');
  btn.disabled = true;
  try {
    const r = await AuthUI.login({ type: 'character', characterId, password }, _capChar);
    if (r.data.needsSetup) { cShowSetup(r.data.characterId, r.data.characterName, r.data.setupTicket); return; }
    if (!r.ok) { errEl.textContent = r.message; return; }
    _storeSession({ role: 'character', characterId: r.data.characterId, characterName: r.data.characterName, charPw: r.data.token });
    showLauncher(_getSession());
  } finally { btn.disabled = false; }
}

// ── Password setup ────────────────────────────────────────────────────────────
let _setupCharId = null;

function cShowSetup(charId, charName, ticket) {
  _setupCharId = charId;
  _setupTicket = ticket || null;
  document.getElementById('char-step-login').style.display = 'none';
  document.getElementById('char-step-setup').style.display = 'block';
  document.getElementById('setup-char-name').textContent   = charName;
  document.getElementById('setup-pw1').value = '';
  document.getElementById('setup-pw2').value = '';
  document.getElementById('setup-err').textContent = '';
  setTimeout(() => document.getElementById('setup-pw1').focus(), 30);
}

function cCancelSetup() {
  _setupCharId = null;
  document.getElementById('char-step-setup').style.display = 'none';
  document.getElementById('char-step-login').style.display = 'block';
  document.getElementById('char-pw').value = '';
  document.getElementById('char-err').textContent = '';
}

async function cSetupPassword() {
  const pw1   = document.getElementById('setup-pw1').value;
  const pw2   = document.getElementById('setup-pw2').value;
  const errEl = document.getElementById('setup-err');
  errEl.textContent = '';
  if (!pw1)         { errEl.textContent = 'Enter a password.'; return; }
  if (pw1 !== pw2)  { errEl.textContent = 'Passwords do not match.'; return; }
  if (pw1.length < 3) { errEl.textContent = 'Password must be at least 3 characters.'; return; }
  const btn = document.getElementById('setup-btn');
  btn.disabled = true;
  try {
    const r = await AuthUI.setFirstPassword(_setupCharId, pw1, _setupTicket);
    if (!r.ok) { errEl.textContent = r.message; return; }
    _storeSession({ role: 'character', characterId: r.data.characterId, characterName: r.data.characterName, charPw: r.data.token });
    showLauncher(_getSession());
  } finally { btn.disabled = false; }
}

// ── DM login ──────────────────────────────────────────────────────────────────
async function cLoginDM() {
  const password = document.getElementById('dm-pw').value;
  const errEl    = document.getElementById('dm-err');
  errEl.textContent = '';
  if (!password) { errEl.textContent = 'Enter the master password.'; return; }
  const r = await AuthUI.login({ type: 'dm', password }, _capDm);
  if (!r.ok) { errEl.textContent = r.message; return; }
  _storeSession({ role: 'dm', masterPw: r.data.token });
  showLauncher(_getSession());
}

// ── Launcher ──────────────────────────────────────────────────────────────────
function showLauncher(sess) {
  document.getElementById('view-login').style.display    = 'none';
  document.getElementById('view-launcher').style.display = '';

  const isDM = sess.role === 'dm';
  document.getElementById('session-badge').innerHTML = isDM
    ? 'Logged in as <strong>Dungeon Master</strong>'
    : `Logged in as <strong>${sess.characterName || 'Character'}</strong>`;

  const btns = document.getElementById('launch-btns');
  btns.innerHTML = '';

  if (isDM) {
    btns.innerHTML += `
      <a href="/console/table-console.html" class="btn-launch">
        <svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-map"></use></svg> Map Screen
        <small>Primary display — map, tokens, controls</small>
      </a>`;
  }

  btns.innerHTML += `
    <a href="/console/table-secondary.html" class="btn-launch">
      <svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-clipboard"></use></svg> Info Panel
      <small>HP, initiative, chat, monster details</small>
    </a>`;
}

function cLogout() {
  const s = _getSession();
  if (s) AuthUI.logout(s.role === 'dm' ? s.masterPw : s.charPw);   // end it on the server too
  sessionStorage.removeItem('rpgSession');
  sessionStorage.removeItem('tableMasterPw');
  sessionStorage.removeItem('dmMasterPw');
  document.getElementById('view-launcher').style.display = 'none';
  document.getElementById('view-login').style.display    = '';
  document.getElementById('char-pw').value = '';
  document.getElementById('dm-pw').value   = '';
  cMountCaptchas();
  cSwitch('character');
}

// ── Init ──────────────────────────────────────────────────────────────────────
(function() {
  let sess = _getSession();
  // A session holding a plain password (a tab from before v226) no longer
  // opens anything — drop it and show the login form.
  const tok = sess ? (sess.role === 'dm' ? sess.masterPw : sess.charPw) : '';
  if (sess && sess.role && !String(tok || '').startsWith('rpgs_')) {
    sessionStorage.removeItem('rpgSession');
    sessionStorage.removeItem('tableMasterPw');
    sessionStorage.removeItem('dmMasterPw');
    sess = null;
  }
  if (sess && sess.role) {
    document.getElementById('view-launcher').style.display = '';
    showLauncher(sess);
  } else {
    document.getElementById('view-login').style.display = '';
    cMountCaptchas();
    cLoadChars();
    setTimeout(() => document.getElementById('char-pw')?.focus(), 100);
  }
})();
</script>
</body>
</html>
