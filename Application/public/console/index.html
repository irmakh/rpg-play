<html lang="en" class="console" data-console>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RPG Console</title>
<link rel="manifest" href="/console/manifest.json">
<meta name="theme-color" content="#000000">
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/templates.css">
<script src="/js/lib/template.js"></script>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/console/console.css">
<script src="/js/lib/icons.js"></script>
<script src="/js/lib/auth-ui.js"></script>
<script src="/js/console/console-login.js"></script>
</head>
<body>

<!-- The launcher: where each of the two screens is opened from. Hidden until
     someone is logged in; ConsoleLogin covers the page with its form until then. -->
<main class="c-page" id="launcher" hidden>
  <div>
    <h1 class="c-title">RPG Console</h1>
    <p class="c-sub">Logged in as <strong id="launcher-who"></strong><span id="launcher-campaign"></span></p>
  </div>

  <nav class="c-rows" aria-label="Console screens">
    <a class="c-row" href="/console/table-console.html">
      <span class="c-row-main"><strong>Map screen</strong><small>Top screen: the map and tokens</small></span>
      <span class="c-row-end">Open</span>
    </a>
    <a class="c-row" href="/console/table-secondary.html">
      <span class="c-row-main"><strong>Info panel</strong><small>Bottom screen: turn order, hit points, chat</small></span>
      <span class="c-row-end">Open</span>
    </a>
    <a class="c-row" href="/console/probe.html">
      <span class="c-row-main"><strong>Device check</strong><small>Screen size and gamepad buttons, as this browser reports them</small></span>
      <span class="c-row-end">Open</span>
    </a>
  </nav>

  <div class="c-page-foot">
    <a class="c-btn plain" href="/">All campaigns</a>
    <!-- The display template button (js/lib/template.js) -->
    <span class="c-tpl" data-tpl-slot></span>
    <button type="button" class="c-btn" onclick="ConsoleLogin.logout()">Log out</button>
  </div>
</main>

<script>
// Show the launcher for a logged-in session. The name goes in as text: it is
// the player's own choice of character name.
function showLauncher(sess) {
  document.getElementById('launcher-who').textContent =
    sess.role === 'dm' ? 'Dungeon Master' : (sess.characterName || 'Character');
  document.getElementById('launcher-campaign').textContent = sess.campaignName ? ` in ${sess.campaignName}` : '';
  document.getElementById('launcher').hidden = false;
}

(function () {
  const sess = ConsoleLogin.init({ title: 'RPG Console', sub: 'Log in to open the map and the info panel.', onLogin: showLauncher });
  if (sess) showLauncher(sess);
})();
</script>
</body>
</html>
