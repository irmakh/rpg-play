<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Viewer</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
<link rel="stylesheet" href="/css/dm.css">
<link rel="stylesheet" href="/css/stories.css">
</head>
<body>

<!-- Stories password gate -->
<div class="gate" id="stories-gate" style="display:none">
  <div class="gate-box">
    <div style="font-size:36px;margin-bottom:10px">📖</div>
    <h2>Stories</h2>
    <p>Enter your password to continue.</p>
    <input type="password" id="gate-pw" placeholder="Password…" autocomplete="off"
           onkeydown="if(event.key==='Enter')storiesGateSubmit()">
    <div id="gate-err" style="color:var(--err);font-size:12px;min-height:16px;margin-top:6px"></div>
    <button class="btn primary" style="width:100%;margin-top:8px" onclick="storiesGateSubmit()">Enter</button>
  </div>
</div>
<script>
(function(){
  try {
    var s = JSON.parse(sessionStorage.getItem('rpgSession') || 'null');
    if (s && (s.role === 'dm' || s.role === 'character')) return;
  } catch {}
  if (sessionStorage.getItem('storiesAuth') === '1') return;
  document.getElementById('stories-gate').style.display = 'flex';
  setTimeout(function(){ var el = document.getElementById('gate-pw'); if(el) el.focus(); }, 50);
})();
async function storiesGateSubmit() {
  var pw = document.getElementById('gate-pw').value;
  var errEl = document.getElementById('gate-err');
  errEl.textContent = '';
  if (!pw) { errEl.textContent = 'Enter a password.'; return; }
  var r = await fetch('/api/auth/verify-any', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  });
  if (r.ok) {
    sessionStorage.setItem('storiesAuth', '1');
    document.getElementById('stories-gate').style.display = 'none';
  } else {
    errEl.textContent = 'Wrong password.';
    document.getElementById('gate-pw').value = '';
    document.getElementById('gate-pw').focus();
  }
}
</script>

<div class="viewer-wrap">

  <div class="stories-hdr">
    <a href="/stories.html" class="btn" style="padding:4px 10px;font-size:11px">← Stories</a>
    <div class="viewer-hdr-info">
      <div id="story-title" class="viewer-story-title">Loading…</div>
      <div id="story-meta" class="viewer-story-meta"></div>
    </div>
    <div class="hdr-right">
      <a id="edit-link" href="#" class="btn sm">Edit</a>
      <div class="layout-toggle">
        <button id="btn-grid"  class="active" onclick="setLayout('grid')">Grid</button>
        <button id="btn-strip" onclick="setLayout('strip')">Strip</button>
      </div>
    </div>
  </div>

  <!-- Cast strip (populated when story has character_ids) -->
  <div class="viewer-cast-strip" id="cast-strip" style="display:none"></div>

  <div class="viewer-body" id="viewer-body">
    <div class="empty-hint">Loading…</div>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" style="display:none" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt="">
</div>

<script>
let story     = null;
let layout    = 'grid';
let portraits = {};  // charId → {name, thumb, species, cls, subclass}

async function init() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { setBody('<div class="empty-hint">No story ID provided.</div>'); return; }

  const [storyRes, portRes] = await Promise.all([
    fetch('/api/stories/' + id),
    fetch('/api/stories/character-portraits'),
  ]);

  if (!storyRes.ok) { setBody('<div class="empty-hint">Story not found.</div>'); return; }
  story = await storyRes.json();

  if (portRes.ok) {
    const chars = await portRes.json();
    portraits = Object.fromEntries(chars.map(c => [c.id, c]));
  }

  document.title = (story.story_name || 'Story') + ' — Viewer';
  document.getElementById('story-title').textContent = story.story_name || 'Untitled';

  const parts = [`${story.seq_count || 0} panels`, (story.created_at || '').slice(0, 10)].filter(Boolean);
  document.getElementById('story-meta').textContent = parts.join(' · ');

  document.getElementById('edit-link').href = '/story-builder.html?id=' + id;

  renderCast();
  render();
}

// ── Cast strip ────────────────────────────────────────────────────────────────
function renderCast() {
  const charIds = Array.isArray(story.character_ids) ? story.character_ids : [];
  const strip   = document.getElementById('cast-strip');
  if (!charIds.length) { strip.style.display = 'none'; return; }

  const chips = charIds.map(cid => {
    const c = portraits[cid];
    if (!c) return '';
    const sub  = [c.species, c.cls, c.subclass].filter(Boolean).join(' · ');
    const img  = c.thumb
      ? `<img src="${esc(c.thumb)}" alt="" class="viewer-cast-img">`
      : `<div class="viewer-cast-no-img">${esc(c.name.charAt(0).toUpperCase())}</div>`;
    return `<div class="viewer-cast-card">
      ${img}
      <div class="viewer-cast-info">
        <div class="viewer-cast-name">${esc(c.name)}</div>
        ${sub ? `<div class="viewer-cast-sub">${esc(sub)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  strip.innerHTML = chips;
  strip.style.display = chips.trim() ? 'flex' : 'none';
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const seqs = story.sequences || [];
  if (!seqs.length) {
    setBody('<div class="empty-hint">This story has no panels yet.<br><a href="/story-builder.html?id=' + story.id + '" style="color:var(--ac)">Add panels →</a></div>');
    return;
  }

  if (layout === 'grid') renderGrid(seqs);
  else renderStrip(seqs);

  document.getElementById('btn-grid').classList.toggle('active', layout === 'grid');
  document.getElementById('btn-strip').classList.toggle('active', layout === 'strip');
}

function renderGrid(seqs) {
  setBody(`<div class="viewer-grid">${seqs.map((s, i) => panelCard(s, i)).join('')}</div>`);
}

function renderStrip(seqs) {
  setBody(`<div class="viewer-strip">${seqs.map((s, i) => panelStrip(s, i)).join('')}</div>`);
}

function panelCard(s, idx) {
  const num = String(s.seq_number).padStart(3, '0');
  const cap = (s.caption || s.prompt || '').trim();
  if (s.image_path) {
    return `<div class="viewer-card">
      <img src="${esc(s.image_path)}?v=${Date.now()}" alt="Panel ${num}" loading="lazy"
           onclick="openLightbox(${idx})">
      <div class="viewer-card-cap">
        <div class="viewer-panel-num">Panel ${num}</div>
        ${cap ? `<div class="viewer-caption">${esc(cap)}</div>` : ''}
      </div>
    </div>`;
  }
  return `<div class="viewer-card">
    <div class="viewer-card-placeholder">No image</div>
    <div class="viewer-card-cap">
      <div class="viewer-panel-num">Panel ${num}</div>
      ${cap ? `<div class="viewer-caption">${esc(cap)}</div>` : ''}
    </div>
  </div>`;
}

function panelStrip(s, idx) {
  const num = String(s.seq_number).padStart(3, '0');
  const cap = (s.caption || s.prompt || '').trim();
  return `<div class="viewer-strip-panel">
    ${s.image_path
      ? `<img src="${esc(s.image_path)}?v=${Date.now()}" alt="Panel ${num}" loading="lazy"
              onclick="openLightbox(${idx})">`
      : `<div class="viewer-strip-placeholder">No image</div>`}
    <div class="viewer-strip-cap">
      <div class="viewer-panel-num">Panel ${num}</div>
      ${cap ? `<div class="viewer-caption">${esc(cap)}</div>` : ''}
    </div>
  </div>`;
}

// ── Layout toggle ─────────────────────────────────────────────────────────────
function setLayout(l) {
  layout = l;
  if (story) render();
}

// ── Lightbox ──────────────────────────────────────────────────────────────────
function openLightbox(idx) {
  const s = (story.sequences || [])[idx];
  if (!s || !s.image_path) return;
  document.getElementById('lb-img').src = s.image_path + '?v=' + Date.now();
  document.getElementById('lb-img').alt = (s.caption || s.prompt || '');
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lb-img').src = '';
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function setBody(html) { document.getElementById('viewer-body').innerHTML = html; }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

init();
</script>
</body>
</html>
