<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlists — DM</title>
<script>(function(){try{var s=JSON.parse(sessionStorage.getItem('rpgSession')||'null');if(!s||s.role!=='dm'){location.replace('/login.html?next='+encodeURIComponent(location.pathname));}}catch(e){location.replace('/login.html');}})();</script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1a1a2e">
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
<link rel="stylesheet" href="/css/dm.css">
<style>
html,body{height:100%;overflow:hidden;margin:0;padding:0}
.sheet{display:flex;flex-direction:column;height:100%;width:100%;max-width:none;margin:0;padding:0}
.hdr{flex-shrink:0;margin-bottom:0;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--a44)}

/* ── Two-pane body ── */
#pl-body{display:flex;flex:1;min-height:0}

/* Sidebar */
#pl-sidebar{width:300px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--a44);background:var(--bg2);min-height:0}
.sb-hdr{flex-shrink:0;font-size:10px;color:var(--ac);text-transform:uppercase;letter-spacing:.5px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 10px;background:var(--a22);border-bottom:1px solid var(--a44);user-select:none}
.sb-hdr .btn.sm{text-transform:none;letter-spacing:0}
.sb-hdr-meta{font-weight:normal;color:var(--txd);text-transform:none;letter-spacing:0;flex:1;text-align:right}

/* Playlist list */
#pl-list{flex-shrink:0;max-height:34vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--a44) transparent;border-bottom:1px solid var(--a44)}
.pl-row{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:1px solid var(--sep);font-size:12px;cursor:pointer}
.pl-row:last-child{border-bottom:none}
.pl-row:hover{background:var(--a22)}
.pl-row.selected{background:var(--a22);border-left:3px solid var(--ac);padding-left:7px}
.pl-row.drop-hint{outline:1px dashed var(--ac);outline-offset:-2px;background:var(--a22)}
.pl-row-name{flex:1;min-width:0;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-row-meta{font-size:10px;color:var(--txd);flex-shrink:0;white-space:nowrap}
.pl-live{color:var(--ok);font-size:10px;flex-shrink:0}
.sb-empty{font-size:11px;color:var(--txd);padding:12px 10px;text-align:center}

/* Library controls */
#lib-controls{flex-shrink:0;display:flex;gap:5px;padding:6px 8px;border-bottom:1px solid var(--sep);flex-wrap:wrap}
#lib-controls input[type=text]{flex:1;min-width:90px;width:auto}
#lib-controls select{width:auto;font-size:11px;padding:3px 4px;flex-shrink:0}
#lib-bulk{flex-shrink:0;display:none;align-items:center;gap:5px;padding:6px 8px;background:var(--a22);border-bottom:1px solid var(--a44);font-size:11px;flex-wrap:wrap}
#lib-bulk select{width:auto;flex:1;min-width:80px;font-size:11px;padding:3px 4px}

/* Library list */
#lib-list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--a44) transparent}
#lib-list.drag-over{outline:2px dashed var(--ac);outline-offset:-4px}
.lib-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--sep);font-size:12px}
.lib-row:last-child{border-bottom:none}
.lib-row:hover{background:var(--a22)}
.lib-row input[type=checkbox]{width:13px;height:13px;cursor:pointer;flex-shrink:0;margin:0}
.lib-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:grab}
.lib-dur{font-size:10px;color:var(--txd);flex-shrink:0;font-variant-numeric:tabular-nums}
.lib-row .row-actions{display:none;gap:2px;flex-shrink:0}
.lib-row:hover .row-actions{display:flex}
.row-btn{background:none;border:none;color:var(--ac);cursor:pointer;font-size:12px;padding:1px 4px;line-height:1;opacity:.75;flex-shrink:0}
.row-btn:hover{opacity:1}
.row-btn.danger{color:#ff8888}
.name-edit{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--ac);color:var(--tx);border-radius:3px;padding:2px 5px;font-size:12px;width:auto}

/* Detail pane */
#pl-detail{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
#det-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--txd);font-size:13px;text-align:center;padding:20px}
#det-hdr{flex-shrink:0;padding:10px 14px;border-bottom:1px solid var(--a44);background:var(--bg2)}
#det-hdr-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#det-name{flex:1;min-width:140px;width:auto;font-size:16px;font-weight:bold;background:transparent;border:1px solid transparent;color:var(--ac);padding:3px 6px}
#det-name:hover{border-color:var(--a55)}
#det-name:focus{background:var(--bg3);border-color:var(--ac)}
#det-hdr-row2{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;font-size:11px}
#det-hdr-row2 select,#det-hdr-row2 input[type=text]{width:auto;font-size:11px;padding:3px 5px}
#det-stats{color:var(--txd);margin-left:auto;white-space:nowrap}

/* Track list */
#trk-list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--a44) transparent}
.trk-row{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--sep);font-size:12px;border-top:2px solid transparent}
.trk-row:hover{background:var(--a22)}
.trk-row.drag-over{border-top:2px solid var(--ac)}
.trk-grip{cursor:grab;color:var(--txd);font-size:13px;flex-shrink:0;user-select:none}
.trk-num{width:20px;text-align:right;color:var(--txd);font-size:10px;flex-shrink:0;font-variant-numeric:tabular-nums}
.trk-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk-dur{font-size:10px;color:var(--txd);flex-shrink:0;font-variant-numeric:tabular-nums}
.trk-row .trk-btns{display:flex;gap:2px;flex-shrink:0}
.trk-row .row-btn:disabled{opacity:.2;cursor:default}
.det-empty-tracks{padding:26px 14px;text-align:center;color:var(--txd);font-size:12px}

/* Live (playing on table) track */
.trk-row.live .trk-name{color:var(--ok);font-weight:bold}

/* Table (live) badge */
#table-badge{display:none;align-items:center;gap:4px;font-size:11px;background:var(--a22);border:1px solid var(--a55);border-radius:3px;padding:2px 6px}
#tb-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ok);font-weight:bold}

/* Modals */
.modal-body{padding:12px 16px}
.drop-zone{border:2px dashed var(--a55);border-radius:6px;padding:18px;text-align:center;color:var(--txd);font-size:12px;cursor:pointer;transition:border-color .15s}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--ac);color:var(--ac);background:var(--a22)}
#up-queue{margin-top:10px;max-height:240px;overflow-y:auto}
.up-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--sep);font-size:12px;flex-wrap:wrap}
.up-row input[type=text]{flex:1;min-width:120px;width:auto;font-size:12px;padding:3px 5px}
.up-size{font-size:10px;color:var(--txd);flex-shrink:0}
.up-state{font-size:10px;flex-shrink:0;min-width:44px;text-align:right}
.up-bar-wrap{flex-basis:100%;background:var(--a22);border-radius:3px;height:4px;overflow:hidden;display:none}
.up-bar{height:100%;width:0%;background:var(--ac);transition:width .1s}
#at-list{max-height:260px;overflow-y:auto;border:1px solid var(--a55);border-radius:3px;background:var(--bg3);margin-top:8px}
#at-list label{display:flex;align-items:center;gap:8px;padding:5px 8px;cursor:pointer;font-size:12px}
#at-list label:hover{background:var(--a22)}
#at-list input[type=checkbox]{width:13px;height:13px;cursor:pointer;flex-shrink:0}
#at-list .at-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#at-list .at-dur{font-size:10px;color:var(--txd)}

/* Mobile: stack panes, restore page scroll */
@media (max-width:760px){
  html,body{overflow:auto}
  .sheet{height:auto;min-height:100dvh}
  #pl-body{flex-direction:column}
  #pl-sidebar{width:100%;border-right:none;border-bottom:1px solid var(--a44)}
  #pl-list{max-height:200px}
  #lib-list{max-height:280px;flex:none}
  #pl-detail{overflow:visible}
  #trk-list{overflow:visible}
}
</style>
</head>
<body>

<!-- Password gate -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div style="font-size:36px;margin-bottom:10px">🎵</div>
    <h2>DM Playlists</h2>
    <p>Enter master password to manage sounds and playlists.</p>
    <input type="password" id="gate-pw" placeholder="Master password…" autocomplete="off"
           onkeydown="if(event.key==='Enter')authenticate()">
    <div id="gate-err"></div>
    <button class="btn primary" style="width:100%" onclick="authenticate()">Unlock</button>
  </div>
</div>

<div class="sheet" id="main-content" style="display:none">

  <!-- Header -->
  <div class="hdr">
    <div class="hdr-left">
      <button class="btn" onclick="location.href='/dm.html'">← DM</button>
      <h1>🎵 Playlists</h1>
      <select id="theme-sel" onchange="applyTheme(this.value)" title="Theme">
        <option value="dark-gold">🌙</option>
        <option value="parchment">📜</option>
        <option value="midnight">🌌</option>
      </select>
    </div>
    <div class="hdr-right">
      <span id="status-msg" style="font-size:11px;color:var(--txd)"></span>
      <span id="table-badge">
        📡 <span id="tb-name"></span>
        <button class="row-btn" id="tb-pp" onclick="tablePauseResume()" title="Pause / resume on table">⏸</button>
        <button class="row-btn" onclick="tableNext()" title="Next track on table">⏭</button>
        <button class="row-btn" onclick="tableStop()" title="Stop on table">⏹</button>
      </span>
    </div>
  </div>

  <!-- Body: sidebar + detail -->
  <div id="pl-body">

    <div id="pl-sidebar">
      <div class="sb-hdr">
        <span>Playlists</span>
        <button class="btn sm primary" onclick="openNewPl()">+ New</button>
      </div>
      <div id="pl-list"><div class="sb-empty">Loading…</div></div>

      <div class="sb-hdr">
        <span>Sound Library</span>
        <span class="sb-hdr-meta" id="lib-count"></span>
        <button class="btn sm" onclick="openUploadModal()">⬆ Upload</button>
      </div>
      <div id="lib-controls">
        <input type="text" id="lib-search" placeholder="Search…" oninput="renderLibrary()">
        <select id="lib-sort" onchange="renderLibrary()" title="Sort">
          <option value="name">A–Z</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
        <select id="lib-filter" onchange="renderLibrary()" title="Filter">
          <option value="all">All</option>
          <option value="orphan">Not in any playlist</option>
        </select>
      </div>
      <div id="lib-bulk">
        <span id="bulk-count"></span>
        <select id="bulk-pl"></select>
        <button class="btn sm primary" onclick="bulkAddToPl()">Add</button>
        <button class="btn sm" onclick="clearLibSel()">✕</button>
      </div>
      <div id="lib-list"
           ondragover="if(event.dataTransfer.types.includes('Files')){event.preventDefault();this.classList.add('drag-over')}"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="handleLibDrop(event)"></div>
    </div>

    <div id="pl-detail"></div>
  </div>

</div>

<!-- New playlist modal -->
<div class="modal-overlay" id="new-pl-modal" style="display:none">
  <div class="modal-box">
    <div class="ct">New Playlist</div>
    <div class="modal-body">
      <div class="field">
        <label class="lbl">Name *</label>
        <input type="text" id="np-name" maxlength="80" placeholder="e.g. Combat Music"
               onkeydown="if(event.key==='Enter')createPl()">
      </div>
      <div class="field">
        <label class="lbl">Type</label>
        <select id="np-type" onchange="document.getElementById('np-map-field').style.display=this.value==='map'?'':'none'">
          <option value="generic">Generic</option>
          <option value="map">Map-based</option>
        </select>
      </div>
      <div class="field" id="np-map-field" style="display:none">
        <label class="lbl">Map Name</label>
        <input type="text" id="np-mapname" maxlength="80" placeholder="Map name">
      </div>
      <div id="np-err" style="font-size:11px;color:var(--err);min-height:14px"></div>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeNewPl()">Cancel</button>
      <button class="btn primary" onclick="createPl()">Create</button>
    </div>
  </div>
</div>

<!-- Upload modal -->
<div class="modal-overlay" id="upload-modal" style="display:none">
  <div class="modal-box" style="max-width:520px">
    <div class="ct">Upload Sounds</div>
    <div class="modal-body">
      <div class="drop-zone" onclick="document.getElementById('up-file').click()"
           ondragover="event.preventDefault();this.classList.add('drag-over')"
           ondragleave="this.classList.remove('drag-over')"
           ondrop="event.preventDefault();this.classList.remove('drag-over');upAddFiles(event.dataTransfer.files)">
        Click or drop audio files here (MP3, WAV, OGG, FLAC, M4A, AAC — max 50 MB each)
      </div>
      <input type="file" id="up-file" multiple accept="audio/*,.mp3,.mpeg,.mp4,.m4a,.wav,.ogg,.flac,.aac,.webm"
             style="display:none" onchange="upAddFiles(this.files);this.value=''">
      <div id="up-queue"></div>
    </div>
    <div class="modal-btns">
      <span id="up-status" style="font-size:11px;color:var(--txd);margin-right:auto;align-self:center"></span>
      <button class="btn" id="up-close" onclick="closeUploadModal()">Close</button>
      <button class="btn primary" id="up-start" onclick="upStart()" disabled>⬆ Upload all</button>
    </div>
  </div>
</div>

<!-- Add tracks modal -->
<div class="modal-overlay" id="addtracks-modal" style="display:none">
  <div class="modal-box" style="max-width:460px">
    <div class="ct">Add Tracks</div>
    <div class="modal-body">
      <input type="text" id="at-search" placeholder="Search sounds…" oninput="renderAtList()">
      <div id="at-list"></div>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeAddTracks()">Cancel</button>
      <button class="btn primary" id="at-add" onclick="atAdd()">Add selected</button>
    </div>
  </div>
</div>

<script src="/js/lib/realtime.js"></script>
<script>
// ── Utils ─────────────────────────────────────────────────────────────────────
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Escape for a single-quoted JS string inside an HTML attribute: onclick="fn('${escJs(v)}')".
function escJs(s) { return String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r\n|\r|\n/g,'\\n').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDur(s) {
  if (s == null || !isFinite(s)) return '–:––';
  s = Math.round(s);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function fmtSize(b) { return (b / 1024 / 1024).toFixed(1) + ' MB'; }
function showStatus(msg, isErr = false) {
  const e = el('status-msg');
  e.textContent = msg;
  e.style.color = isErr ? 'var(--err)' : 'var(--ok)';
  setTimeout(() => { if (e.textContent === msg) e.textContent = ''; }, 3000);
}
function plSoundIds(pl) { return (pl.sounds || []).map(s => typeof s === 'string' ? s : s.id); }

// ── Theme ─────────────────────────────────────────────────────────────────────
function applyTheme(name) {
  document.body.className = name === 'dark-gold' ? '' : 'theme-' + name;
  localStorage.setItem('dm-theme', name);
  const sel = el('theme-sel');
  if (sel) sel.value = name;
}
(function(){ applyTheme(localStorage.getItem('dm-theme') || 'dark-gold'); })();

// ── Auth ──────────────────────────────────────────────────────────────────────
let masterPw = '';
function authenticate() {
  const pw = el('gate-pw').value;
  if (!pw) { el('gate-err').textContent = 'Enter password.'; return; }
  fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'dm', password: pw }) })
    .then(r => r.json()).then(d => {
      if (d.ok || d.role === 'dm') { masterPw = pw; unlock(); }
      else el('gate-err').textContent = d.error || 'Wrong password.';
    }).catch(() => { el('gate-err').textContent = 'Connection error.'; });
}
function unlock() {
  el('gate').style.display = 'none';
  el('main-content').style.display = '';
  loadAll();
  fetchTableState();
}
function authHeaders() { return { 'Content-Type': 'application/json', 'X-Master-Password': masterPw }; }

// Try auto-unlock from session
(function() {
  const s = JSON.parse(sessionStorage.getItem('rpgSession') || 'null');
  if (s && s.role === 'dm' && s.masterPw) { masterPw = s.masterPw; unlock(); }
})();

// ── State ─────────────────────────────────────────────────────────────────────
let sounds = [];
let playlists = [];
let selectedPlId = null;
let libSelected = new Set();

async function loadAll() {
  const [sRes, pRes] = await Promise.all([
    fetch('/api/sounds', { headers: authHeaders() }),
    fetch('/api/playlists', { headers: authHeaders() }),
  ]);
  sounds = sRes.ok ? await sRes.json() : [];
  playlists = pRes.ok ? await pRes.json() : [];
  if (selectedPlId && !playlists.find(p => p.id === selectedPlId)) selectedPlId = null;
  for (const id of [...libSelected]) if (!sounds.find(s => s.id === id)) libSelected.delete(id);
  renderAll();
  queueDurations();
}
function renderAll() {
  renderPlaylistList();
  renderLibrary();
  renderDetail();
}

// ── Durations (lazy, cached in localStorage) ─────────────────────────────────
let durations = {};
try { durations = JSON.parse(localStorage.getItem('plSoundDur') || '{}'); } catch {}
const _durQueue = [];
let _durActive = 0;
function queueDurations() {
  sounds.forEach(s => { if (durations[s.id] == null && !_durQueue.includes(s.id)) _durQueue.push(s.id); });
  pumpDurations();
}
function pumpDurations() {
  while (_durActive < 2 && _durQueue.length) {
    const id = _durQueue.shift();
    const s = sounds.find(x => x.id === id);
    if (!s) continue;
    _durActive++;
    const a = new Audio();
    a.preload = 'metadata';
    const done = d => {
      _durActive--;
      a.onloadedmetadata = a.onerror = null;
      a.removeAttribute('src');
      if (d != null && isFinite(d)) {
        durations[id] = d;
        try { localStorage.setItem('plSoundDur', JSON.stringify(durations)); } catch {}
        updateDurLabels(id);
      }
      pumpDurations();
    };
    a.onloadedmetadata = () => done(a.duration);
    a.onerror = () => done(null);
    a.src = s.url;
  }
}
function updateDurLabels(id) {
  document.querySelectorAll(`[data-dur-for="${id}"]`).forEach(e => { e.textContent = fmtDur(durations[id]); });
  updateLibHeader();
  updateDetailStats();
}
// Sum durations for a set of ids; returns '' unless all are known
function totalDurLabel(ids) {
  let total = 0;
  for (const id of ids) {
    if (durations[id] == null) return '';
    total += durations[id];
  }
  return ids.length ? ' · ' + fmtDur(total) : '';
}

// ── Playlist sidebar ─────────────────────────────────────────────────────────
function renderPlaylistList() {
  const listEl = el('pl-list');
  if (!playlists.length) {
    listEl.innerHTML = '<div class="sb-empty">No playlists yet — create one.</div>';
    return;
  }
  listEl.innerHTML = playlists.map(pl => {
    const cnt = (pl.sounds || []).length;
    const icon = pl.type === 'map' ? '🗺' : '🎶';
    const live = (tableState && tableState.url && tableState.playlistId === pl.id)
      ? `<span class="pl-live">${tableState.isPlaying ? '📡' : '⏸'}</span>` : '';
    return `<div class="pl-row${pl.id === selectedPlId ? ' selected' : ''}" onclick="selectPl('${escJs(pl.id)}')"
      ondragover="plRowDragOver(event,this)" ondragleave="this.classList.remove('drop-hint')"
      ondrop="plRowDrop(event,'${escJs(pl.id)}',this)">
      <span>${icon}</span>
      <span class="pl-row-name" title="${esc(pl.name)}">${esc(pl.name)}</span>
      ${live}
      <span class="pl-row-meta">${cnt}</span>
    </div>`;
  }).join('');
}
function selectPl(id) {
  selectedPlId = id;
  renderPlaylistList();
  renderDetail();
}

// Drag a library sound onto a playlist row
let _dragSoundId = null;
function plRowDragOver(e, row) {
  if (_dragSoundId == null) return;
  e.preventDefault();
  row.classList.add('drop-hint');
}
async function plRowDrop(e, plId, row) {
  e.preventDefault();
  row.classList.remove('drop-hint');
  if (_dragSoundId == null) return;
  const soundId = _dragSoundId;
  _dragSoundId = null;
  await addSoundsToPl(plId, [soundId]);
}

// ── New / delete playlist ────────────────────────────────────────────────────
function openNewPl() {
  el('np-name').value = '';
  el('np-type').value = 'generic';
  el('np-mapname').value = '';
  el('np-map-field').style.display = 'none';
  el('np-err').textContent = '';
  el('new-pl-modal').style.display = 'flex';
  el('np-name').focus();
}
function closeNewPl() { el('new-pl-modal').style.display = 'none'; }
async function createPl() {
  const name = el('np-name').value.trim();
  if (!name) { el('np-err').textContent = 'Name is required.'; return; }
  const body = { name, type: el('np-type').value, sounds: [], map_name: el('np-mapname').value.trim() };
  const resp = await fetch('/api/playlists', { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
  const d = await resp.json().catch(() => ({}));
  if (!resp.ok) { el('np-err').textContent = d.error || 'Failed'; return; }
  closeNewPl();
  selectedPlId = d.id;
  showStatus('Playlist created: ' + name);
  await loadAll();
}
async function deletePl(id, name) {
  if (!confirm('Delete playlist "' + name + '"?\n(Sounds stay in the library.)')) return;
  await fetch('/api/playlists/' + id, { method: 'DELETE', headers: authHeaders() });
  if (selectedPlId === id) selectedPlId = null;
  showStatus('Playlist deleted');
  await loadAll();
}

// ── Playlist saves ───────────────────────────────────────────────────────────
async function savePlMeta() {
  const pl = playlists.find(p => p.id === selectedPlId);
  if (!pl) return;
  const name = el('det-name').value.trim();
  if (!name) { el('det-name').value = pl.name; return; }
  const type = el('det-type').value;
  const map_name = el('det-mapname').value.trim();
  const resp = await fetch('/api/playlists/' + pl.id, {
    method: 'PUT', headers: authHeaders(),
    body: JSON.stringify({ name, type, map_name })
  });
  if (!resp.ok) { showStatus('Save failed', true); return; }
  pl.name = name; pl.type = type; pl.map_name = map_name;
  el('det-mapname').style.display = type === 'map' ? '' : 'none';
  renderPlaylistList();
}
async function savePlSounds(pl, ids) {
  const resp = await fetch('/api/playlists/' + pl.id, {
    method: 'PUT', headers: authHeaders(),
    body: JSON.stringify({ sounds: ids })
  });
  if (!resp.ok) { showStatus('Save failed', true); return false; }
  pl.sounds = ids.map(id => sounds.find(s => s.id === id) || { id, name: '?' });
  return true;
}
async function addSoundsToPl(plId, soundIds) {
  const pl = playlists.find(p => p.id === plId);
  if (!pl) return;
  const current = plSoundIds(pl);
  const merged = [...current, ...soundIds.filter(id => !current.includes(id))];
  if (merged.length === current.length) { showStatus('Already in playlist'); return; }
  if (await savePlSounds(pl, merged)) {
    showStatus('Added to ' + pl.name);
    renderPlaylistList();
    if (plId === selectedPlId) renderDetail();
    if (el('lib-filter').value === 'orphan') renderLibrary();
  }
}

// ── Detail pane ──────────────────────────────────────────────────────────────
function renderDetail() {
  const pane = el('pl-detail');
  const pl = playlists.find(p => p.id === selectedPlId);
  if (!pl) {
    pane.innerHTML = '<div id="det-empty">Select a playlist on the left,<br>or create a new one.</div>';
    return;
  }
  const ids = plSoundIds(pl);
  const rows = ids.length ? ids.map((id, i) => {
    const s = (pl.sounds || [])[i];
    const nm = (s && typeof s === 'object' && s.name) ? s.name : (sounds.find(x => x.id === id)?.name || '?');
    const live = tableState && tableState.url && tableState.playlistId === pl.id && tableState.trackIndex === i;
    const playBtn = (live && tableState.isPlaying)
      ? `<button class="row-btn" onclick="tablePauseResume()" title="Pause on table">⏸</button>`
      : `<button class="row-btn" onclick="playOnTable('${escJs(pl.id)}',${i})" title="Play on table (all players)">▶</button>`;
    return `<div class="trk-row${live ? ' live' : ''}" draggable="true" data-idx="${i}"
      ondragstart="trkDragStart(event,${i})" ondragend="trkDragEnd()"
      ondragover="trkDragOver(event,this)" ondragleave="this.classList.remove('drag-over')"
      ondrop="trkDrop(event,${i},this)">
      <span class="trk-grip" title="Drag to reorder">⠿</span>
      <span class="trk-num">${i + 1}.</span>
      ${playBtn}
      <span class="trk-name" title="${esc(nm)}">${esc(nm)}${live ? ' 📡' : ''}</span>
      <span class="trk-dur" data-dur-for="${esc(id)}">${fmtDur(durations[id])}</span>
      <span class="trk-btns">
        <button class="row-btn" onclick="moveTrackBtn(${i},-1)" ${i === 0 ? 'disabled' : ''} title="Move up">▲</button>
        <button class="row-btn" onclick="moveTrackBtn(${i},1)" ${i === ids.length - 1 ? 'disabled' : ''} title="Move down">▼</button>
        <button class="row-btn danger" onclick="removeTrack(${i})" title="Remove from playlist">✕</button>
      </span>
    </div>`;
  }).join('')
  : '<div class="det-empty-tracks">No tracks yet.<br>Use <b>+ Add tracks</b>, or drag sounds from the library onto this playlist.</div>';

  pane.innerHTML = `
    <div id="det-hdr">
      <div id="det-hdr-row1">
        <input type="text" id="det-name" maxlength="80" value="${esc(pl.name)}" onchange="savePlMeta()" title="Click to rename">
        <button class="btn sm primary" onclick="playOnTable('${escJs(pl.id)}',0)" ${ids.length ? '' : 'disabled'} title="Play playlist on table (all players)">📡 Play on table</button>
        <button class="btn sm" onclick="openAddTracks()">+ Add tracks</button>
        <button class="btn sm danger" onclick="deletePl('${escJs(pl.id)}','${escJs(pl.name)}')" title="Delete playlist">🗑</button>
      </div>
      <div id="det-hdr-row2">
        <select id="det-type" onchange="savePlMeta()">
          <option value="generic" ${pl.type !== 'map' ? 'selected' : ''}>🎶 Generic</option>
          <option value="map" ${pl.type === 'map' ? 'selected' : ''}>🗺 Map-based</option>
        </select>
        <input type="text" id="det-mapname" maxlength="80" placeholder="Map name" value="${esc(pl.map_name || '')}"
               onchange="savePlMeta()" style="${pl.type === 'map' ? '' : 'display:none'}">
        <span id="det-stats"></span>
      </div>
    </div>
    <div id="trk-list">${rows}</div>`;
  updateDetailStats();
}
function updateDetailStats() {
  const e = el('det-stats');
  const pl = playlists.find(p => p.id === selectedPlId);
  if (!e || !pl) return;
  const ids = plSoundIds(pl);
  e.textContent = ids.length + ' track' + (ids.length === 1 ? '' : 's') + totalDurLabel(ids);
}

// Track reorder / remove
let _dragTrkIdx = null;
function trkDragStart(e, idx) {
  _dragTrkIdx = idx;
  e.dataTransfer.setData('text/plain', String(idx));
  e.dataTransfer.effectAllowed = 'move';
}
function trkDragEnd() { _dragTrkIdx = null; }
function trkDragOver(e, row) {
  if (_dragTrkIdx == null) return;
  e.preventDefault();
  row.classList.add('drag-over');
}
function trkDrop(e, toIdx, row) {
  e.preventDefault();
  row.classList.remove('drag-over');
  if (_dragTrkIdx == null || _dragTrkIdx === toIdx) return;
  moveTrack(_dragTrkIdx, toIdx);
  _dragTrkIdx = null;
}
async function moveTrack(from, to) {
  const pl = playlists.find(p => p.id === selectedPlId);
  if (!pl) return;
  const ids = plSoundIds(pl);
  if (from < 0 || from >= ids.length || to < 0 || to >= ids.length) return;
  const [item] = ids.splice(from, 1);
  ids.splice(to, 0, item);
  if (await savePlSounds(pl, ids)) renderDetail();
}
function moveTrackBtn(i, dir) { moveTrack(i, i + dir); }
async function removeTrack(i) {
  const pl = playlists.find(p => p.id === selectedPlId);
  if (!pl) return;
  const ids = plSoundIds(pl);
  ids.splice(i, 1);
  if (await savePlSounds(pl, ids)) {
    renderDetail();
    renderPlaylistList();
    if (el('lib-filter').value === 'orphan') renderLibrary();
  }
}

// ── Add-tracks picker ────────────────────────────────────────────────────────
function openAddTracks() {
  el('at-search').value = '';
  renderAtList();
  el('addtracks-modal').style.display = 'flex';
  el('at-search').focus();
}
function closeAddTracks() { el('addtracks-modal').style.display = 'none'; }
function renderAtList() {
  const pl = playlists.find(p => p.id === selectedPlId);
  if (!pl) return;
  const inPl = new Set(plSoundIds(pl));
  const q = el('at-search').value.toLowerCase();
  const avail = sounds.filter(s => !inPl.has(s.id) && (!q || s.name.toLowerCase().includes(q)));
  el('at-list').innerHTML = avail.length
    ? avail.map(s => `<label>
        <input type="checkbox" value="${esc(s.id)}">
        <span class="at-name">${esc(s.name)}</span>
        <span class="at-dur">${fmtDur(durations[s.id])}</span>
      </label>`).join('')
    : '<div style="padding:10px;font-size:11px;color:var(--txd)">' + (q ? 'No matches.' : 'All sounds are already in this playlist.') + '</div>';
}
async function atAdd() {
  const ids = Array.from(document.querySelectorAll('#at-list input[type=checkbox]:checked')).map(cb => cb.value);
  if (!ids.length) { closeAddTracks(); return; }
  closeAddTracks();
  await addSoundsToPl(selectedPlId, ids);
}

// ── Sound library ────────────────────────────────────────────────────────────
function libFilteredSounds() {
  const q = (el('lib-search').value || '').toLowerCase();
  const filter = el('lib-filter').value;
  const sort = el('lib-sort').value;
  let list = sounds.filter(s => !q || s.name.toLowerCase().includes(q));
  if (filter === 'orphan') {
    const used = new Set();
    playlists.forEach(pl => plSoundIds(pl).forEach(id => used.add(id)));
    list = list.filter(s => !used.has(s.id));
  }
  list = [...list];
  if (sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
  else if (sort === 'newest') list.sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')));
  else list.sort((a, b) => String(a.created_at || '').localeCompare(String(b.created_at || '')));
  return list;
}
function renderLibrary() {
  const list = libFilteredSounds();
  const e = el('lib-list');
  e.innerHTML = list.length ? list.map(s => `
    <div class="lib-row" draggable="true"
         ondragstart="_dragSoundId='${escJs(s.id)}';event.dataTransfer.setData('text/plain','${escJs(s.id)}');event.dataTransfer.effectAllowed='copy'"
         ondragend="_dragSoundId=null">
      <input type="checkbox" ${libSelected.has(s.id) ? 'checked' : ''} onchange="toggleLibSel('${escJs(s.id)}',this.checked)">
      <span class="lib-name" id="lib-name-${esc(s.id)}" title="${esc(s.name)} — drag onto a playlist" ondblclick="startRename('${escJs(s.id)}')">${esc(s.name)}</span>
      <span class="lib-dur" data-dur-for="${esc(s.id)}">${fmtDur(durations[s.id])}</span>
      <span class="row-actions">
        <button class="row-btn" onclick="startRename('${escJs(s.id)}')" title="Rename">✏</button>
        <button class="row-btn danger" onclick="deleteSound('${escJs(s.id)}','${escJs(s.name)}')" title="Delete sound">🗑</button>
      </span>
    </div>`).join('')
    : '<div class="sb-empty">' + (sounds.length ? 'No matches.' : 'No sounds yet — upload some.') + '</div>';
  updateLibHeader();
  renderBulkBar();
}
function updateLibHeader() {
  el('lib-count').textContent = sounds.length + totalDurLabel(sounds.map(s => s.id));
}

// Multi-select + bulk add
function toggleLibSel(id, on) {
  if (on) libSelected.add(id); else libSelected.delete(id);
  renderBulkBar();
}
function clearLibSel() {
  libSelected.clear();
  renderLibrary();
}
function renderBulkBar() {
  const bar = el('lib-bulk');
  if (!libSelected.size) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  el('bulk-count').textContent = libSelected.size + ' selected →';
  const sel = el('bulk-pl');
  const keep = sel.value;
  sel.innerHTML = playlists.map(pl => `<option value="${esc(pl.id)}">${esc(pl.name)}</option>`).join('');
  if (playlists.find(p => p.id === keep)) sel.value = keep;
}
async function bulkAddToPl() {
  const plId = el('bulk-pl').value;
  if (!plId || !libSelected.size) return;
  // Visible selection first (keeps current sort order), then any selected sounds the filter hides
  const ids = libFilteredSounds().filter(s => libSelected.has(s.id)).map(s => s.id);
  for (const id of libSelected) if (!ids.includes(id)) ids.push(id);
  await addSoundsToPl(plId, ids);
  clearLibSel();
}

// Rename / delete sound
function startRename(id) {
  const span = el('lib-name-' + id);
  const s = sounds.find(x => x.id === id);
  if (!span || !s) return;
  const input = document.createElement('input');
  input.className = 'name-edit';
  input.value = s.name;
  input.maxLength = 120;
  let done = false;
  const finish = async save => {
    if (done) return;
    done = true;
    const newName = input.value.trim();
    if (save && newName && newName !== s.name) {
      const resp = await fetch('/api/sounds/' + id, { method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ name: newName }) });
      if (resp.ok) { s.name = newName; renderPlaylistList(); renderDetail(); }
      else showStatus('Rename failed', true);
    }
    renderLibrary();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') finish(true);
    else if (e.key === 'Escape') finish(false);
  };
  input.onblur = () => finish(true);
  span.replaceWith(input);
  input.focus();
  input.select();
}
async function deleteSound(id, name) {
  if (!confirm('Delete "' + name + '"?\nIt is removed from all playlists too.')) return;
  await fetch('/api/sounds/' + id, { method: 'DELETE', headers: authHeaders() });
  delete durations[id];
  showStatus('Deleted: ' + name);
  await loadAll();
}

// ── Upload (multi-file queue) ────────────────────────────────────────────────
const MAX_AUDIO_MB = 50;
let upQueue = [];       // { file, name, status: pending|uploading|done|error, pct, err }
let _uploading = false;

function openUploadModal(files) {
  upQueue = upQueue.filter(q => q.status === 'pending' || q.status === 'uploading');
  el('up-status').textContent = '';
  renderUpQueue();
  el('upload-modal').style.display = 'flex';
  if (files && files.length) upAddFiles(files);
}
function closeUploadModal() {
  if (_uploading) { el('up-status').textContent = 'Wait for uploads to finish…'; return; }
  el('upload-modal').style.display = 'none';
}
function handleLibDrop(e) {
  e.preventDefault();
  el('lib-list').classList.remove('drag-over');
  if (e.dataTransfer.files && e.dataTransfer.files.length) openUploadModal(e.dataTransfer.files);
}
function upAddFiles(fileList) {
  for (const f of fileList) {
    const item = { file: f, name: f.name.replace(/\.[^.]+$/, ''), status: 'pending', pct: 0, err: '' };
    if (f.size > MAX_AUDIO_MB * 1024 * 1024) { item.status = 'error'; item.err = 'Too large (max ' + MAX_AUDIO_MB + ' MB)'; }
    upQueue.push(item);
  }
  renderUpQueue();
}
function upRemove(i) {
  if (upQueue[i] && upQueue[i].status !== 'uploading') { upQueue.splice(i, 1); renderUpQueue(); }
}
function renderUpQueue() {
  const e = el('up-queue');
  e.innerHTML = upQueue.map((q, i) => {
    const state = q.status === 'pending' ? '' :
      q.status === 'uploading' ? q.pct + '%' :
      q.status === 'done' ? '✓' : '✕ ' + esc(q.err);
    const color = q.status === 'done' ? 'var(--ok)' : q.status === 'error' ? 'var(--err)' : 'var(--txd)';
    return `<div class="up-row">
      <input type="text" value="${esc(q.name)}" maxlength="120" placeholder="Sound name"
             onchange="upQueue[${i}].name=this.value" ${q.status !== 'pending' ? 'disabled' : ''}>
      <span class="up-size">${fmtSize(q.file.size)}</span>
      <span class="up-state" style="color:${color}">${state}</span>
      ${q.status === 'pending' || q.status === 'error' ? `<button class="row-btn danger" onclick="upRemove(${i})" title="Remove">✕</button>` : ''}
      <div class="up-bar-wrap" id="up-bar-wrap-${i}" style="${q.status === 'uploading' ? 'display:block' : ''}"><div class="up-bar" id="up-bar-${i}" style="width:${q.pct}%"></div></div>
    </div>`;
  }).join('');
  const pending = upQueue.filter(q => q.status === 'pending').length;
  el('up-start').disabled = _uploading || !pending;
  el('up-start').textContent = _uploading ? 'Uploading…' : '⬆ Upload ' + (pending || 'all');
}
async function upStart() {
  if (_uploading) return;
  _uploading = true;
  renderUpQueue();
  let ok = 0, fail = 0;
  for (let i = 0; i < upQueue.length; i++) {
    const q = upQueue[i];
    if (q.status !== 'pending') continue;
    q.name = q.name.trim();
    if (!q.name) { q.status = 'error'; q.err = 'Name required'; fail++; renderUpQueue(); continue; }
    q.status = 'uploading';
    renderUpQueue();
    try {
      const dataUrl = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = e => res(e.target.result);
        r.onerror = () => rej(new Error('Read failed'));
        r.readAsDataURL(q.file);
      });
      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = e => {
          if (e.lengthComputable) {
            q.pct = Math.round(e.loaded / e.total * 100);
            const bar = el('up-bar-' + i);
            if (bar) { bar.style.width = q.pct + '%'; el('up-bar-wrap-' + i).style.display = 'block'; }
            const rows = document.querySelectorAll('#up-queue .up-state');
            if (rows[i]) rows[i].textContent = q.pct + '%';
          }
        };
        xhr.onload = () => {
          try {
            const d = JSON.parse(xhr.responseText);
            if (xhr.status >= 200 && xhr.status < 300) resolve(d);
            else reject(new Error(d.error || 'Upload failed'));
          } catch { reject(new Error('Upload failed')); }
        };
        xhr.onerror = () => reject(new Error('Network error'));
        xhr.open('POST', '/api/sounds');
        Object.entries(authHeaders()).forEach(([k, v]) => xhr.setRequestHeader(k, v));
        xhr.send(JSON.stringify({ name: q.name, dataUrl, tags: [] }));
      });
      q.status = 'done';
      ok++;
    } catch (err) {
      q.status = 'error';
      q.err = err.message;
      fail++;
    }
    renderUpQueue();
  }
  _uploading = false;
  el('up-status').textContent = ok + ' uploaded' + (fail ? ', ' + fail + ' failed' : '');
  renderUpQueue();
  if (ok) { showStatus(ok + ' sound' + (ok === 1 ? '' : 's') + ' uploaded'); await loadAll(); }
}

// ── Table playback (live for all players) ────────────────────────────────────
let tableState = null;
async function fetchTableState() {
  try { tableState = await fetch('/api/sound/state').then(r => r.json()); } catch {}
  renderTableBadge();
  renderPlaylistList();
  renderDetail();
}
function handleSoundEvent(d) {
  if (!d || !d.action) return;
  if (d.action === 'play') {
    tableState = { ...(tableState || {}), isPlaying: true, url: d.url, name: d.name, playlistId: d.playlistId || null, trackIndex: d.trackIndex || 0, position: d.position || 0 };
  } else if (d.action === 'pause') {
    tableState = { ...(tableState || {}), isPlaying: false, position: d.position ?? (tableState?.position || 0) };
  } else if (d.action === 'stop') {
    tableState = { ...(tableState || {}), isPlaying: false, url: null, name: null, playlistId: null, trackIndex: 0, position: 0 };
  } else return;
  renderTableBadge();
  renderPlaylistList();
  renderDetail();
}
function renderTableBadge() {
  const badge = el('table-badge');
  if (!tableState || !tableState.url) { badge.style.display = 'none'; return; }
  badge.style.display = 'inline-flex';
  el('tb-name').textContent = tableState.name || '';
  el('tb-name').title = 'Playing on table: ' + (tableState.name || '');
  el('tb-pp').textContent = tableState.isPlaying ? '⏸' : '▶';
}
async function soundControl(body) {
  await fetch('/api/sound/control', { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) }).catch(() => {});
}
async function playOnTable(plId, idx) {
  await soundControl({ action: 'play', playlistId: plId, trackIndex: idx });
  showStatus('Playing on table');
}
async function tablePauseResume() {
  let st = null;
  try { st = await fetch('/api/sound/state').then(r => r.json()); } catch {}
  if (!st || !st.url) return;
  if (st.isPlaying) await soundControl({ action: 'pause', position: st.currentPosition || 0 });
  else await soundControl({ action: 'play', playlistId: st.playlistId, trackIndex: st.trackIndex, position: st.position || 0 });
}
async function tableNext() { await soundControl({ action: 'next' }); }
async function tableStop() { await soundControl({ action: 'stop' }); }

// ── Realtime: presence + live table playback state ───────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  if (window.connectRealtime) connectRealtime({ sound: handleSoundEvent });
});

// ── Modal backdrop close ─────────────────────────────────────────────────────
el('new-pl-modal').addEventListener('click', function(e) { if (e.target === this) closeNewPl(); });
el('upload-modal').addEventListener('click', function(e) { if (e.target === this) closeUploadModal(); });
el('addtracks-modal').addEventListener('click', function(e) { if (e.target === this) closeAddTracks(); });
</script>
