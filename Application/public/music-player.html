<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Now Playing</title>
<!-- The pop-out-only player was replaced by /music.html, which seeds itself from
     the server instead of waiting for an opener window to hand it state. This
     stub stays behind for anything still pointing at the old URL: an installed
     desktop client from before the change, a bookmark, a cached shortcut. -->
<meta http-equiv="refresh" content="0;url=/music.html">
<script>location.replace('/music.html' + location.search);</script>
<link rel="stylesheet" href="/css/tokens.css">
<style>
/* No base.css on this page, so the colour scheme is declared here: without it
   the UA paints a light canvas and renders form controls and scrollbars light. */
html{color-scheme:dark}
body{background:var(--ink);color:var(--ash);font:15px var(--ui);padding:16px}</style>
</head>
<body><a href="/music.html" style="color:var(--arc)">Now Playing has moved to /music.html</a></body>
</html>
