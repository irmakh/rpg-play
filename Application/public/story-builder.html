<!-- Stories password gate -->
<div class="gate" id="stories-gate" style="display:none">
  <div class="gate-box">
    <div style="font-size:36px;margin-bottom:10px"><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-book"></use></svg> </div>
    <h2>Stories</h2>
    <p>Enter your password to continue.</p>
    <input type="password" id="gate-pw" placeholder="Password…" autocomplete="off"
           onkeydown="if(event.key==='Enter')storiesGateSubmit()">
    <div id="gate-cap" style="margin-top:12px;text-align:left"></div>
    <div id="gate-err" style="color:var(--blood);font-size:12px;min-height:16px;margin-top:6px"></div>
    <button class="btn primary" style="width:100%;margin-top:8px" onclick="storiesGateSubmit()">Enter</button>
  </div>
</div>
<script>
// The password gate. Shown when this tab holds no DM or character session —
// and again by storiesFetch() (js/lib/stories-auth.js) if a request comes back
// 401 because the session has gone.
function storiesShowGate() {
  var gate = document.getElementById('stories-gate');
  if (!gate || gate.style.display === 'flex') return;
  gate.style.display = 'flex';
  if (!window._storiesCap) window._storiesCap = AuthUI.captcha(document.getElementById('gate-cap'), { onEnter: storiesGateSubmit });
  setTimeout(function(){ var el = document.getElementById('gate-pw'); if(el) el.focus(); }, 50);
}
if (!storiesSession()) storiesShowGate();
async function storiesGateSubmit() {
  var pw = document.getElementById('gate-pw').value;
  var errEl = document.getElementById('gate-err');
  errEl.textContent = '';
  if (!pw) { errEl.textContent = 'Enter a password.'; return; }
  var r = await AuthUI.verifyAny(pw, window._storiesCap);
  // The gate now starts a real session (v235). Keep it and reload, so the page
  // loads its data with the login rather than the requests it already lost.
  if (r.ok && storiesStoreSession(r.data)) {
    location.reload();
  } else {
    errEl.textContent = r.ok ? 'Could not start a session. Try again.' : r.message;
    document.getElementById('gate-pw').value = '';
    document.getElementById('gate-pw').focus();
  }
}
</script>

<div class="builder-wrap">

  <!-- Header -->
  <div class="stories-hdr">
    <a href="/stories.html" class="btn" style="padding:4px 10px;font-size:11px"><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-arrow-left"></use></svg> Stories</a>
    <h1 id="page-title">Story Editor</h1>
    <div class="hdr-right">
      <span id="save-status" class="status-msg"></span>
      <a id="view-link" href="#" class="btn sm" style="display:none"><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-eye"></use></svg> View</a>
    </div>
  </div>

  <!-- Story metadata bar -->
  <div class="builder-meta-bar">
    <div class="field" style="flex:2;min-width:160px;margin:0">
      <label class="lbl">Title</label>
      <input type="text" id="meta-title" maxlength="120" placeholder="Story title…"
             oninput="scheduleSave()">
    </div>
    <div class="field" style="flex:3;min-width:200px;margin:0">
      <label class="lbl">Description</label>
      <input type="text" id="meta-desc" maxlength="300" placeholder="Short description…"
             oninput="scheduleSave()">
    </div>
  </div>

  <!-- Character multiselect -->
  <div class="builder-cast-bar" id="cast-bar">
    <div class="cast-bar-label">Cast</div>
    <div class="cast-chips" id="cast-chips">
      <div class="cast-loading">Loading characters…</div>
    </div>
  </div>

  <!-- Panels -->
  <div class="builder-panels" id="panels"></div>

  <!-- Footer -->
  <div class="builder-foot">
    <button class="btn primary" onclick="addPanel()">+ Add Panel</button>
    <span id="panel-count" style="font-size:11px;color:var(--ash)"></span>
  </div>

</div>

<!-- Delete panel confirm modal -->
<div class="modal-overlay" id="del-panel-modal" style="display:none" onclick="if(event.target===this)closeDelPanel()">
  <div class="modal-box" style="max-width:340px;width:96%">
    <div class="ct">Delete Panel</div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--bone)">Delete this panel and its image or video? This cannot be undone.</p>
    </div>
    <div class="modal-btns">
      <button class="btn" onclick="closeDelPanel()">Cancel</button>
      <button class="btn danger" onclick="confirmDelPanel()">Delete</button>
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let storyId         = null;
let sequences       = [];
let saveTimer       = null;
let delTarget       = null;
let allChars        = [];         // [{id, name, thumb, species, cls, subclass}]
let selectedCharIds = new Set();  // currently selected character IDs
let uploading       = new Map();  // seqId -> percent, while a video is uploading

const MAX_VIDEO_BYTES = 500 * 1024 * 1024;   // matches the server's limit
// Videos keep one cache-buster per page load (or per upload), not Date.now()
// per render like images: a new URL on every re-render would re-fetch the video.
const pageLoadVer = Date.now();
function isVideoPath(p) { return /\.(mp4|webm)$/i.test(p || ''); }

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(location.search);
  storyId = params.get('id');
  if (!storyId) { showStatus('No story ID — go back and create a story first.', true); return; }
  await Promise.all([loadStory(), loadCharacters()]);
}

async function loadCharacters() {
  try {
    const r = await storiesFetch('/api/stories/character-portraits');
    if (r.ok) allChars = await r.json();
  } catch {}
  renderCastBar();
}

async function loadStory() {
  const r = await storiesFetch('/api/stories/' + storyId);
  if (!r.ok) { showStatus('Story not found.', true); return; }
  const data = await r.json();

  document.getElementById('meta-title').value = data.story_name || '';
  document.getElementById('meta-desc').value  = data.description || '';
  document.title = (data.story_name || 'Story') + ' — Editor';
  document.getElementById('page-title').textContent = data.story_name || 'Story Editor';

  const viewLink = document.getElementById('view-link');
  viewLink.href = '/story-viewer.html?id=' + storyId;
  viewLink.style.display = '';

  selectedCharIds = new Set(Array.isArray(data.character_ids) ? data.character_ids : []);

  sequences = (data.sequences || []).map(s => ({
    id:         s.id,
    seq_number: s.seq_number,
    caption:    s.caption || s.prompt || '',
    image_path: s.image_path || '',
  }));
  sequences.sort((a, b) => a.seq_number - b.seq_number);

  if (!sequences.length) await addPanel();
  else renderPanels();
}

// ── Cast bar ──────────────────────────────────────────────────────────────────
function renderCastBar() {
  const el = document.getElementById('cast-chips');
  if (!allChars.length) {
    el.innerHTML = '<div class="cast-loading">No characters found</div>';
    return;
  }
  el.innerHTML = allChars.map(c => {
    const sel = selectedCharIds.has(c.id);
    const img = c.thumb
      ? `<img src="${escAttr(c.thumb)}" alt="" class="cast-chip-img">`
      : `<div class="cast-chip-no-img">${esc(c.name.charAt(0).toUpperCase())}</div>`;
    return `<button class="cast-chip${sel ? ' selected' : ''}" onclick="toggleChar('${escJs(c.id)}')" title="${escAttr(c.name)}">
      ${img}
      <span class="cast-chip-name">${esc(c.name)}</span>
    </button>`;
  }).join('');
}

function toggleChar(charId) {
  if (selectedCharIds.has(charId)) selectedCharIds.delete(charId);
  else selectedCharIds.add(charId);
  renderCastBar();
  scheduleSave();
}

// ── Metadata auto-save ────────────────────────────────────────────────────────
function scheduleSave() {
  clearTimeout(saveTimer);
  showStatus('Unsaved…');
  saveTimer = setTimeout(saveMetadata, 1500);
}

async function saveMetadata() {
  const title = document.getElementById('meta-title').value.trim();
  if (!title) { showStatus('Title required.', true); return; }
  showStatus('Saving…');
  const charIds   = [...selectedCharIds];
  const charNames = allChars.filter(c => selectedCharIds.has(c.id)).map(c => c.name).join(', ');
  const r = await storiesFetch('/api/stories/' + storyId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title,
      character:    charNames,
      description:  document.getElementById('meta-desc').value.trim(),
      characterIds: charIds,
    })
  });
  if (r.ok) {
    const d = await r.json();
    document.getElementById('page-title').textContent = d.story_name || 'Story Editor';
    document.title = (d.story_name || 'Story') + ' — Editor';
    showStatus('Saved <svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg> ');
    setTimeout(() => showStatus(''), 2000);
  } else {
    showStatus('Save failed.', true);
  }
}

// ── Panel rendering ───────────────────────────────────────────────────────────
function renderPanels() {
  const el = document.getElementById('panels');
  if (!sequences.length) {
    el.innerHTML = '<div class="empty-hint" style="padding:40px">No panels yet. Click "+ Add Panel" to start.</div>';
    updatePanelCount();
    return;
  }

  el.innerHTML = sequences.map((s, i) => {
    const num     = String(s.seq_number).padStart(3, '0');
    const isFirst = i === 0;
    const isLast  = i === sequences.length - 1;
    const pct     = uploading.get(s.id);
    // A video has its own playback controls, so clicking it plays rather than
    // replaces — it gets a Replace button instead.
    const isVideo = isVideoPath(s.image_path);
    const imgHtml = pct != null
      ? `<div class="panel-img-empty panel-uploading">
           <span class="panel-upload-pct">${pct}%</span>
           <span>Uploading video…</span>
           <div class="panel-upload-bar"><div style="width:${pct}%"></div></div>
         </div>`
      : isVideo
      ? `<video class="panel-img panel-video" src="${esc(s.image_path)}?v=${s.mediaVer || pageLoadVer}"
                preload="metadata" controls playsinline></video>`
      : s.image_path
      ? `<img class="panel-img" src="${esc(s.image_path)}?v=${Date.now()}" alt=""
              onclick="triggerUpload('${escJs(s.id)}')" title="Click to replace image">`
      : `<div class="panel-img-empty" onclick="triggerUpload('${escJs(s.id)}')">
           <span style="font-size:24px"><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-image"></use></svg> </span>
           <span>Upload image or video (MP4, WebM)</span>
         </div>`;
    const busy = pct != null;
    return `<div class="panel-card" id="pc-${escAttr(s.id)}">
      <div class="panel-num">${num}</div>
      <div class="panel-img-area">
        ${imgHtml}
        <input type="file" accept="image/*,video/mp4,video/webm" id="fi-${escAttr(s.id)}" style="display:none"
               onchange="uploadImage('${escJs(s.id)}', this)">
        ${isVideo && !busy ? `<button class="panel-img-clear" onclick="triggerUpload('${escJs(s.id)}')" title="Replace video">Replace</button>` : ''}
        ${s.image_path && !busy ? `<button class="panel-img-clear" onclick="clearImage('${escJs(s.id)}')" title="Remove ${isVideo ? 'video' : 'image'}"><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg> Remove</button>` : ''}
      </div>
      <div class="panel-caption-wrap">
        <textarea class="panel-caption" rows="4"
                  placeholder="Panel caption or story text…"
                  oninput="scheduleCaptionSave('${escJs(s.id)}', this)"
                  onblur="flushCaptionSave('${escJs(s.id)}')"
        >${esc(s.caption)}</textarea>
      </div>
      <div class="panel-controls">
        <button class="panel-btn" onclick="movePanel('${escJs(s.id)}', -1)" ${isFirst ? 'disabled' : ''} title="Move up"><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-chevron-up"></use></svg> </button>
        <button class="panel-btn" onclick="movePanel('${escJs(s.id)}', 1)" ${isLast ? 'disabled' : ''} title="Move down"><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-chevron-down"></use></svg> </button>
        <button class="panel-btn del" onclick="openDelPanel('${escJs(s.id)}')" title="Delete panel"><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg> </button>
      </div>
    </div>`;
  }).join('');

  updatePanelCount();
}

function updatePanelCount() {
  const n = sequences.length;
  document.getElementById('panel-count').textContent = n ? `${n} panel${n !== 1 ? 's' : ''}` : '';
}

// ── Add panel ─────────────────────────────────────────────────────────────────
async function addPanel() {
  const r = await storiesFetch(`/api/stories/${storyId}/sequences`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ caption: '' })
  });
  if (!r.ok) { showStatus('Failed to add panel.', true); return; }
  const seq = await r.json();
  sequences.push({ id: seq.id, seq_number: seq.seq_number, caption: '', image_path: '' });
  renderPanels();
  setTimeout(() => {
    const el = document.getElementById('pc-' + seq.id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }, 50);
}

// ── Delete panel ──────────────────────────────────────────────────────────────
function openDelPanel(seqId) {
  delTarget = seqId;
  document.getElementById('del-panel-modal').style.display = 'flex';
}
function closeDelPanel() { document.getElementById('del-panel-modal').style.display = 'none'; delTarget = null; }

async function confirmDelPanel() {
  if (!delTarget) return;
  const seqId = delTarget;
  closeDelPanel();
  const r = await storiesFetch(`/api/stories/${storyId}/sequences/${seqId}`, { method: 'DELETE' });
  if (!r.ok) { showStatus('Delete failed.', true); return; }
  sequences = sequences.filter(s => s.id !== seqId);
  renumber();
  renderPanels();
}

// ── Reorder panels ────────────────────────────────────────────────────────────
async function movePanel(seqId, dir) {
  const idx = sequences.findIndex(s => s.id === seqId);
  const to  = idx + dir;
  if (to < 0 || to >= sequences.length) return;
  [sequences[idx], sequences[to]] = [sequences[to], sequences[idx]];
  renumber();
  renderPanels();
  const order = sequences.map(s => ({ id: s.id, seqNumber: s.seq_number }));
  await storiesFetch(`/api/stories/${storyId}/sequences/reorder`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order })
  });
}

function renumber() {
  sequences.forEach((s, i) => { s.seq_number = i + 1; });
}

// ── Caption auto-save ─────────────────────────────────────────────────────────
const captionTimers = {};

function scheduleCaptionSave(seqId, ta) {
  const seq = sequences.find(s => s.id === seqId);
  if (seq) seq.caption = ta.value;
  clearTimeout(captionTimers[seqId]);
  captionTimers[seqId] = setTimeout(() => saveCaption(seqId), 1500);
}

function flushCaptionSave(seqId) {
  clearTimeout(captionTimers[seqId]);
  saveCaption(seqId);
}

async function saveCaption(seqId) {
  const seq = sequences.find(s => s.id === seqId);
  if (!seq) return;
  await storiesFetch(`/api/stories/${storyId}/sequences/${seqId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ caption: seq.caption })
  });
}

// ── Image upload ──────────────────────────────────────────────────────────────
function triggerUpload(seqId) {
  document.getElementById('fi-' + seqId)?.click();
}

async function uploadImage(seqId, input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';

  const seq = sequences.find(s => s.id === seqId);
  if (!seq) return;

  const imgArea = document.querySelector(`#pc-${seqId} .panel-img-area`);
  if (imgArea) {
    const placeholder = imgArea.querySelector('.panel-img-empty') || imgArea.querySelector('.panel-img');
    if (placeholder) placeholder.style.opacity = '0.4';
  }

  const videoType = videoTypeOf(file);
  if (videoType) return uploadVideo(seq, file, videoType);
  if (!file.type.startsWith('image/')) { showStatus('Choose an image, or an MP4 or WebM video.', true); renderPanels(); return; }

  const dataUrl = await fileToDataUrl(file);
  const r = await storiesFetch(`/api/stories/${storyId}/sequences/${seqId}/image`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dataUrl })
  });
  const d = await r.json();
  if (!r.ok) { showStatus(d.error || 'Upload failed.', true); renderPanels(); return; }
  seq.image_path = d.imagePath;
  renderPanels();
}

// ── Video upload ──────────────────────────────────────────────────────────────
// Videos go up as the raw file rather than a base64 data URL, which for 500 MB
// would mean a 667 MB string in memory. XMLHttpRequest rather than fetch,
// because only XHR reports upload progress.
// The upload's Content-Type. Some systems leave file.type empty, so the
// extension is the fallback.
function videoTypeOf(file) {
  if (file.type === 'video/mp4' || file.type === 'video/webm') return file.type;
  if (/\.mp4$/i.test(file.name))  return 'video/mp4';
  if (/\.webm$/i.test(file.name)) return 'video/webm';
  return null;
}

function uploadVideo(seq, file, videoType) {
  if (file.size > MAX_VIDEO_BYTES) {
    showStatus(`That video is ${(file.size / 1048576).toFixed(0)} MB — the limit is 500 MB.`, true);
    renderPanels();
    return;
  }
  uploading.set(seq.id, 0);
  renderPanels();

  const xhr = new XMLHttpRequest();
  xhr.open('POST', `/api/stories/${storyId}/sequences/${seq.id}/video`);
  const headers = storiesHeaders({ 'Content-Type': videoType });
  for (const [k, v] of Object.entries(headers)) xhr.setRequestHeader(k, v);

  // Update the bar in place: re-rendering every panel on each progress event
  // would restart any video playing in another panel.
  xhr.upload.onprogress = e => {
    if (!e.lengthComputable) return;
    const pct = Math.min(99, Math.floor(e.loaded / e.total * 100));
    uploading.set(seq.id, pct);
    const card = document.getElementById('pc-' + seq.id);
    const label = card?.querySelector('.panel-upload-pct');
    const bar   = card?.querySelector('.panel-upload-bar > div');
    if (label) label.textContent = pct + '%';
    if (bar) bar.style.width = pct + '%';
  };

  const done = (msg) => {
    uploading.delete(seq.id);
    if (msg) showStatus(msg, true);
    renderPanels();
  };

  xhr.onload = () => {
    let d = {};
    try { d = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status === 401) {
      // Same as storiesFetch: the session has gone, ask for the password again.
      try { sessionStorage.removeItem('rpgSession'); } catch {}
      if (typeof storiesShowGate === 'function') storiesShowGate();
      return done('Your session ended — log in and upload again.');
    }
    if (xhr.status < 200 || xhr.status >= 300) return done(d.error || 'Video upload failed.');
    seq.image_path = d.imagePath;
    seq.mediaVer   = Date.now();
    done();
  };
  xhr.onerror = () => done('Video upload failed — the connection dropped.');
  xhr.onabort = () => done('Video upload cancelled.');
  xhr.send(file);
}

// Leaving the page would abort an upload in progress, so ask first.
window.addEventListener('beforeunload', e => {
  if (uploading.size) { e.preventDefault(); e.returnValue = ''; }
});

async function clearImage(seqId) {
  const r = await storiesFetch(`/api/stories/${storyId}/sequences/${seqId}/image`, { method: 'DELETE' });
  if (!r.ok) { showStatus('Failed to remove image.', true); return; }
  const seq = sequences.find(s => s.id === seqId);
  if (seq) seq.image_path = '';
  renderPanels();
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function fileToDataUrl(file) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => res(rd.result);
    rd.onerror = rej;
    rd.readAsDataURL(file);
  });
}

function showStatus(msg, isErr) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.style.color = isErr ? 'var(--blood)' : 'var(--ash)';
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// Escape for a single-quoted JS string inside an HTML attribute: onclick="fn('${escJs(v)}')".
// (escAttr's &#39; gets decoded back to a bare quote before inline JS runs, so it can't be used here.)
function escJs(s) { return String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r\n|\r|\n/g,'\\n').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDelPanel(); });

init();
</script>
</body>
</html>
