<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — RPG Play</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080C15">
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{font-family:var(--ui);background:var(--ink);color:var(--bone);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-wrap{width:100%;max-width:380px;padding:16px}
.login-box{background:var(--slate);border:1px solid var(--rule-hi);border-radius:10px;padding:32px 28px}
.logo{text-align:center;margin-bottom:24px}
.logo h1{color:var(--bone);font-family:var(--display);font-variation-settings:'opsz' 72,'WONK' 1;font-size:var(--t-xl);font-weight:600}
.logo p{color:var(--ash);font-size:11px;margin-top:4px;}
.tabs{display:flex;gap:0;margin-bottom:24px;border-radius:5px;overflow:hidden;border:1px solid var(--rule-hi)}
.tab-btn{flex:1;padding:8px;background:transparent;border:none;color:var(--ash);font-size:12px;font-weight:bold;cursor:pointer;transition:background .15s}
.tab-btn.active{background:var(--arc);color:var(--ink)}
.tab-btn:not(.active):hover{background:var(--wash);color:var(--bone)}
.tab-content{display:none}
.tab-content.active{display:block}
.field{margin-bottom:14px}
label{display:block;font-size:10px;color:var(--bone);margin-bottom:4px}
input,select{width:100%;background:var(--slate-hi);border:1px solid var(--rule-hi);color:var(--bone);border-radius:4px;padding:8px 10px;font-size:13px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--arc);background:var(--slate-hi)}
select option{background:var(--slate-hi)}
.btn{width:100%;padding:12px;background:var(--arc);border:none;color:var(--ink);border-radius:4px;font-size:13px;font-weight:bold;cursor:pointer;margin-top:4px}
.btn:hover{background:var(--arc-hi)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err-msg{color:var(--blood);font-size:11px;min-height:16px;margin-bottom:10px;text-align:center}
.ok-msg{color:var(--verdigris);font-size:11px;min-height:16px;margin-bottom:10px;text-align:center}
.divider{border:none;border-top:1px solid var(--rule);margin:16px 0}
.hint{font-size:11px;color:var(--ash);text-align:center;margin-top:12px}
/* Setup step */
#char-setup-step{display:none}
#char-login-step{display:block}
.step-title{font-size:13px;color:var(--bone);font-weight:bold;margin-bottom:4px}
.step-sub{font-size:11px;color:var(--ash);margin-bottom:16px}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="logo">
      <h1><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-swords"></use></svg> RPG Play</h1>
      <p>Tactical D&amp;D Companion</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('character')" id="tab-char-btn">Character</button>
      <button class="tab-btn" onclick="switchTab('dm')" id="tab-dm-btn">Dungeon Master</button>
    </div>

    <!-- Character tab -->
    <div class="tab-content active" id="tab-character">
      <!-- Step 1: select + password -->
      <div id="char-login-step">
        <div class="field">
          <label>Character</label>
          <select id="char-select" onchange="onCharSelect()">
            <option value="">Loading…</option>
          </select>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="char-pw" placeholder="Enter password…" autocomplete="current-password"
                 onkeydown="if(event.key==='Enter')loginCharacter()">
        </div>
        <div id="char-cap"></div>
        <div class="err-msg" id="char-err"></div>
        <button class="btn" onclick="loginCharacter()" id="char-login-btn">Login</button>
      </div>

      <!-- Step 2: first-time password setup -->
      <div id="char-setup-step">
        <div class="step-title" id="setup-char-name"></div>
        <div class="step-sub">This character has no password yet.<br>Set one to continue.</div>
        <div class="field">
          <label>New Password</label>
          <input type="password" id="setup-pw1" placeholder="Choose a password…" autocomplete="new-password"
                 onkeydown="if(event.key==='Enter')document.getElementById('setup-pw2').focus()">
        </div>
        <div class="field">
          <label>Confirm Password</label>
          <input type="password" id="setup-pw2" placeholder="Confirm password…" autocomplete="new-password"
                 onkeydown="if(event.key==='Enter')setupPassword()">
        </div>
        <div class="err-msg" id="setup-err"></div>
        <button class="btn" onclick="setupPassword()" id="setup-btn">Set Password &amp; Login</button>
        <button class="btn" style="margin-top:8px;background:transparent;border:1px solid var(--rule-hi);color:var(--ash)"
                onclick="cancelSetup()">Back</button>
      </div>
    </div>

    <!-- DM tab -->
    <div class="tab-content" id="tab-dm">
      <div class="field">
        <label>Master Password</label>
        <input type="password" id="dm-pw" placeholder="Enter master password…" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')loginDM()">
      </div>
      <div id="dm-cap"></div>
      <div class="err-msg" id="dm-err"></div>
      <button class="btn" onclick="loginDM()">Login as DM</button>
    </div>

    <div class="hint">Session is stored in this browser tab only.</div>
  </div>
</div>
<script src="/js/lib/icons.js"></script>
<script src="/js/lib/auth-ui.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
