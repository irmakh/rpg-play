<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Maintenance</title>
  <link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/fonts.css">
<style>
    
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--ui);background:var(--ink);color:var(--bone);min-height:100vh}
    a{color:var(--arc-hi)}
    .wrap{max-width:1200px;margin:0 auto;padding:18px}

    /* Login gate */
    #gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    #gate .card{background:var(--slate);border:1px solid var(--rule);border-radius:12px;padding:28px;width:100%;max-width:360px}
    #gate h1{margin:0 0 4px;font-size:20px;color:var(--bone)}
    #gate p{margin:0 0 18px;color:var(--ash);font-size:13px}
    #gate input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--sunken);color:var(--bone);font-size:15px}
    #gate button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:var(--arc);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer}
    #gate button:hover{background:var(--arc-hi)}
    #gate-err{color:var(--blood);font-size:13px;margin-top:10px;min-height:16px}

    /* Dashboard */
    #panel{display:none}
    .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
    .top h1{margin:0;font-size:19px;color:var(--bone)}
    .pill{background:var(--slate-hi);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--bone)}
    .top .spacer{flex:1}
    .top button{background:var(--slate-hi);border:1px solid var(--rule);color:var(--bone);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px}
    .top button:hover{border-color:var(--arc)}
    .muted{color:var(--ash);font-size:12px}

    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
    .client{background:var(--slate);border:1px solid var(--rule);border-radius:10px;padding:14px;border-left:4px solid var(--ash-dim)}
    .client.dm{border-left-color:var(--bone)}
    .client.character{border-left-color:var(--verdigris)}
    .client .who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.4px}
    .badge.dm{background:var(--bone);color:#1a1a2e}
    .badge.character{background:var(--verdigris);color:#08210f}
    .badge.none{background:var(--ash-dim);color:#0b1119}
    .client .name{font-weight:600;font-size:15px}
    .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-top:1px dashed var(--rule)}
    .row:first-of-type{border-top:0}
    .row .k{color:var(--ash)}
    .row .v{text-align:right;word-break:break-word}
    .page-v{color:var(--arc-hi);font-family:ui-monospace,Consolas,monospace}
    .ip-v{font-family:ui-monospace,Consolas,monospace}
    .ver-ok{color:var(--verdigris)}
    .ver-stale{color:#e06a6a;font-weight:700}
    #btn-reload-all{background:#7a2e2e;border-color:#a04a4a;color:#fff}
    #btn-reload-all:hover{background:#9a3a3a}
    #btn-reload-outdated{background:var(--slate-hi)}
    .top button:disabled{opacity:.45;cursor:not-allowed}
    .ua{color:var(--ash);font-size:11px;margin-top:8px;word-break:break-word}
    #empty{color:var(--ash);padding:40px;text-align:center}
  </style>
</head>
<body>
  <!-- Login gate -->
  <div id="gate">
    <div class="card">
      <h1><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-gear"></use></svg> Maintenance</h1>
      <p>Enter the DM password to view connected clients.</p>
      <form id="gate-form" autocomplete="off">
        <input id="gate-pw" type="password" placeholder="DM password" autocomplete="current-password">
        <button type="submit">Unlock</button>
        <div id="gate-err"></div>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="panel">
    <div class="wrap">
      <div class="top">
        <h1><svg class="lt-icon" aria-hidden="true" focusable="false"><use href="#i-gear"></use></svg> Connected clients</h1>
        <span class="pill" id="count-pill">0 connected</span>
        <span class="pill" id="ver-pill" title="Current deployed frontend version"></span>
        <span class="muted" id="updated"></span>
        <span class="spacer"></span>
        <button id="btn-reload-outdated" title="Reload only clients running an old version">Reload outdated</button>
        <button id="btn-reload-all" title="Reload every connected client">Force reload all</button>
        <button id="btn-refresh">Refresh now</button>
        <button id="btn-logout">Lock</button>
      </div>
      <div id="cards" class="cards"></div>
      <div id="empty" style="display:none">No clients are currently connected.</div>
    </div>
  </div>

  <script src="/js/lib/icons.js"></script>
<script src="/js/maintenance.js"></script>
</body>
</html>
