version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: char_sheet_dev
    ports:
      - "${HOST_PORT:-443}:${PORT:-443}"
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-443}
      - MASTER_PASSWORD=${MASTER_PASSWORD:-15243}
      - WS_URL=${WS_URL}
    volumes:
      # Mount application code for hot reload (exclude node_modules)
      - ./Application:/app:delegated
      # Use named volume for node_modules to preserve Linux-compiled binaries
      - /app/node_modules
      # SQLite databases are covered by the ./Application mount above:
      #   Application/campaigns.db            the campaign registry
      #   Application/data/campaigns/<id>/    one campaign's localdb / media /
      #                                       stories / aiDM databases
      # The pre-multi-tenant files (localdb.db, media.db, stories.db,
      # aiDM/aiDM.db) are still present as a rollback copy and are no longer
      # read by the server.
      # Mount Let's Encrypt certificates (read-only)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  node_modules:
